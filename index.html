<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Virtual Try-On Studio</title>
  <link href="./output.css" rel="stylesheet">
  <!-- Supabase Web SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    /* Prevent pull-to-refresh & make it feel like a native iOS app */
    body { overscroll-behavior-y: contain; background-color: #000; color: #fff; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    
    /* Camera UI Elements */
    .shutter-btn {
      width: 76px; height: 76px; border-radius: 50%; background-color: white;
      border: 4px solid #000; outline: 3px solid white; transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .shutter-btn:active { transform: scale(0.85); }
    
    /* Animations */
    .fade-in { animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Custom Scrollbar for Search */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #111; }
    ::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }

    /* Selected Garment Outline */
    .garment-selected { border: 3px solid #3b82f6; transform: scale(0.95); opacity: 0.8; }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col font-sans antialiased selection:bg-transparent">

  <!-- VIEW 1: Camera Interface -->
  <div id="cameraView" class="absolute inset-0 flex flex-col justify-between z-10">
    <div class="h-24 bg-black bg-opacity-80 flex justify-between items-end pb-4 px-6 relative z-20 backdrop-blur-md">
      <button id="openAddGarmentBtn" class="w-10 h-10 flex items-center justify-center bg-gray-800 bg-opacity-70 rounded-full active:scale-90 transition-transform">
        <i class="bi bi-plus-lg text-white text-xl"></i>
      </button>
      <span class="text-xs font-bold tracking-widest text-blue-400 uppercase">Try-On Camera</span>
      <button id="uploadBtn" class="w-10 h-10 flex items-center justify-center bg-gray-800 bg-opacity-70 rounded-full active:scale-90 transition-transform">
        <i class="bi bi-image text-white"></i>
      </button>
      <input type="file" id="fileInput" class="hidden" accept="image/*" />
    </div>
    
    <div class="relative flex-1 bg-black flex items-center justify-center overflow-hidden">
      <!-- Updated Error Message UI -->
      <div id="cameraErrorMsg" class="hidden absolute z-30 flex flex-col items-center justify-center px-6 text-center space-y-3 bg-black bg-opacity-70 p-6 rounded-2xl backdrop-blur-sm">
        <i class="bi bi-camera-video-off text-4xl text-gray-400"></i>
        <p class="text-gray-300 text-sm font-medium">Camera not found or access denied.</p>
        <button onclick="document.getElementById('fileInput').click()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold mt-2">Upload Photo Instead</button>
      </div>
      <video id="cameraFeed" class="absolute w-full h-full object-cover" autoplay playsinline></video>
      <canvas id="captureCanvas" class="hidden"></canvas>
    </div>

    <div class="h-40 bg-black bg-opacity-90 flex items-center justify-around px-6 pb-8 backdrop-blur-md">
      <button id="openLibraryBtn" class="w-14 h-14 rounded-xl overflow-hidden bg-gray-800 shadow-lg border border-gray-700 active:scale-95 transition-transform bg-cover bg-center"></button>
      <button id="captureBtn" class="shutter-btn shadow-2xl"></button>
      <button id="switchCameraBtn" class="w-14 h-14 flex items-center justify-center bg-gray-800 bg-opacity-60 rounded-full active:scale-95 transition-transform">
        <i class="bi bi-arrow-repeat text-white text-2xl"></i>
      </button>
    </div>
  </div>

  <!-- VIEW 2: Add Garment Modal -->
  <div id="addGarmentView" class="hidden absolute inset-0 bg-black bg-opacity-95 backdrop-blur-xl z-50 flex flex-col items-center justify-center p-6">
    <div class="w-full max-w-md bg-gray-900 rounded-3xl p-6 shadow-2xl border border-gray-800 flex flex-col space-y-5">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold text-white uppercase tracking-widest">Add New Suit</h2>
        <button id="closeAddGarmentBtn" class="text-gray-400 active:scale-90 text-2xl"><i class="bi bi-x"></i></button>
      </div>
      
      <div id="garmentPreviewContainer" class="w-full aspect-square bg-gray-800 rounded-2xl flex items-center justify-center overflow-hidden border border-gray-700 cursor-pointer active:opacity-80">
        <i id="garmentPreviewIcon" class="bi bi-camera text-4xl text-gray-500"></i>
        <img id="garmentPreviewImg" class="hidden w-full h-full object-cover" />
      </div>
      <input type="file" id="garmentFileInput" class="hidden" accept="image/*" />
      
      <input type="text" id="garmentNameInput" placeholder="E.g. Navy Blue Tuxedo" class="w-full bg-gray-800 text-white px-4 py-3 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 placeholder-gray-500" autocomplete="off" />
      
      <button id="saveGarmentBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition active:scale-95 flex justify-center items-center">
        Save to Wardrobe
      </button>
    </div>
  </div>

  <!-- VIEW 3: Garment Selection -->
  <div id="garmentSelectView" class="hidden absolute inset-0 bg-gray-950 z-20 flex flex-col">
    <div class="h-16 flex items-center justify-between px-4 mt-safe border-b border-gray-800 bg-gray-950">
      <button id="cancelSelectBtn" class="text-white text-lg active:opacity-50">Cancel</button>
      <span class="text-sm font-semibold tracking-widest uppercase">Select Suit</span>
      <div class="w-16"></div>
    </div>
    
    <div class="flex-1 flex flex-col p-4 overflow-hidden space-y-4">
      <div class="flex items-center space-x-4 bg-gray-900 p-2 rounded-2xl border border-gray-800">
        <img id="capturedThumb" class="w-16 h-16 rounded-xl object-cover border border-gray-700" />
        <div class="flex-1 relative">
          <i class="bi bi-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
          <input type="text" id="searchInput" placeholder="Search suits..." class="w-full bg-gray-800 text-white pl-10 pr-4 py-2 rounded-xl outline-none text-sm focus:ring-1 focus:ring-blue-500" />
        </div>
      </div>

      <div id="garmentsGrid" class="flex-1 grid grid-cols-3 gap-2 overflow-y-auto pb-20 content-start">
        <!-- Garments injected here via JS -->
      </div>
    </div>

    <div class="absolute bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-black to-transparent">
      <button id="generateTryOnBtn" disabled class="w-full bg-blue-600 disabled:bg-gray-700 disabled:text-gray-400 text-white font-bold py-4 px-4 rounded-2xl shadow-2xl transition active:scale-95 text-lg uppercase tracking-widest">
        Generate Try-On
      </button>
    </div>
  </div>

  <!-- VIEW 4: Processing Overlay -->
  <div id="processingView" class="hidden absolute inset-0 bg-black bg-opacity-95 backdrop-blur-xl z-40 flex flex-col items-center justify-center space-y-5">
    <div class="w-14 h-14 border-4 border-gray-700 border-t-blue-500 rounded-full animate-spin"></div>
    <p id="timerText" class="text-lg font-medium text-white tracking-widest uppercase">Styling... 0s</p>
    <p class="text-xs text-gray-500 uppercase tracking-widest">This may take up to 30 seconds</p>
  </div>

  <!-- VIEW 5: Comparison Slider -->
  <div id="comparisonView" class="hidden absolute inset-0 bg-black z-30 flex flex-col">
    <div class="h-20 flex items-end justify-between px-5 pb-3">
      <button id="closeComparisonBtn" class="text-white text-lg active:opacity-50">Back</button>
      <span class="text-sm font-semibold tracking-widest uppercase text-gray-300">Result</span>
      <div class="flex items-center space-x-4">
        <button id="deleteBtn" class="text-red-500 active:opacity-50 p-1 flex items-center justify-center min-w-[24px]">
          <i class="bi bi-trash text-2xl"></i>
        </button>
        <button id="downloadBtn" class="text-blue-400 active:opacity-50 p-1">
          <i class="bi bi-download text-2xl"></i>
        </button>
      </div>
    </div>
    
    <div class="flex-1 flex items-center justify-center p-4">
      <div id="compareContainer" class="relative mx-auto rounded-2xl select-none bg-gray-900 shadow-2xl" style="touch-action: none;">
        <img id="imgOriginal" class="block rounded-2xl w-full h-full pointer-events-none" draggable="false" />
        <div id="imgOverlayWrapper" class="absolute top-0 left-0 h-full overflow-hidden rounded-2xl z-10" style="width: 50%;">
          <img id="imgGenerated" class="block rounded-2xl h-full pointer-events-none max-w-none" draggable="false" />
        </div>
        <div id="sliderHandle" class="absolute top-0 bottom-0 flex flex-col items-center justify-center cursor-ew-resize z-20" style="left: 50%; transform: translateX(-50%); width: 40px;">
          <div class="absolute top-0 bottom-0 w-1 bg-white shadow-md z-10"></div>
          <div class="relative w-10 h-10 bg-white rounded-full shadow-lg flex items-center justify-center z-20">
            <i class="bi bi-arrows-collapse text-gray-800"></i>
          </div>
        </div>
      </div>
    </div>
    <p class="text-center text-xs text-green-400 pb-10 uppercase tracking-widest font-bold"><i class="bi bi-check-circle-fill mr-1"></i> Auto-Saved to Gallery</p>
  </div>

  <!-- VIEW 6: Library Gallery -->
  <div id="libraryView" class="hidden absolute inset-0 bg-black z-50 flex flex-col">
    <div class="h-20 flex items-end justify-between px-4 pb-3 border-b border-gray-900 bg-gray-950 mt-safe">
      <button id="closeLibraryBtn" class="text-blue-400 flex items-center space-x-1 text-lg active:opacity-50">
        <i class="bi bi-chevron-left"></i> <span>Camera</span>
      </button>
      <span class="text-sm font-semibold tracking-widest uppercase">Gallery</span>
      <div class="w-20"></div>
    </div>
    <div class="flex-1 overflow-y-auto p-1 bg-black">
      <div id="galleryGrid" class="grid grid-cols-3 gap-1"></div>
    </div>
  </div>

  <script>
    // --- SUPABASE CONFIGURATION ---
    const SUPABASE_URL = 'https://rmfubnduytozikcgzvok.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJtZnVibmR1eXRvemlrY2d6dm9rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2OTIyMDgsImV4cCI6MjA5NzI2ODIwOH0.XmxDD8mH8rgq3OZmD7jVophtH2W3NNDgSRJKC3RXvJU';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // --- STATE & PROMPT ---
    let videoStream = null;
    let currentFacingMode = 'environment';
    let currentOriginalDataUrl = null; 
    let selectedGarmentBase64 = null;
    let allGarments = [];
    
    const VIRTUAL_TRY_ON_PROMPT = `Edit the **first photo** by replacing only the clothing/outfit with the **exact suit shown in the second reference photo**.

### Strict preservation requirements
* Keep my **face 100% unchanged**. Do not alter facial structure, identity, skin texture, eyes, eyebrows, nose, lips, jawline, hairstyle, facial hair, expression, or proportions.
* Keep my **body position and pose exactly unchanged**.
* Keep the **camera angle, framing, perspective, lighting direction, shadows, and image composition exactly unchanged**.
* Keep the **entire background exactly unchanged**. Do not regenerate, blur, replace, crop, extend, or modify any background elements.
* Keep my **hands, arms, neck, head position, and visible body proportions exactly as they are**.
* Do not change my height, body shape, posture, or proportions.
* Do not apply beauty filters, face enhancement, skin smoothing, age changes, or AI-style facial reconstruction.

### Suit replacement
Use the **second photo only as the clothing reference**. Recreate its suit accurately on my body:
* Same suit color
* Same fabric appearance and texture
* Same lapel style
* Same jacket cut and fit
* Same shirt
* Same tie, if present
* Same buttons and pocket details
* Same overall formal styling

The suit must naturally conform to my **existing body position and anatomy**, including realistic folds, wrinkles, fabric tension, shoulder placement, sleeves, collar, and perspective.

### Important
This is a **clothing replacement only**, NOT a face swap or full-image regeneration.
The final result should look like the original photograph was genuinely taken with me wearing the suit from the second photo. **Preserve everything from the first image except the clothing.**`;

    let isViewingGalleryItem = false;
    let currentActiveDocId = null;
    let currentActiveOrigPath = null;
    let currentActiveGenPath = null;

    const cameraFeed = document.getElementById('cameraFeed');
    const [cameraView, garmentSelectView, processingView, comparisonView, libraryView, addGarmentView] = 
      ['cameraView', 'garmentSelectView', 'processingView', 'comparisonView', 'libraryView', 'addGarmentView'].map(id => document.getElementById(id));

    // --- CAMERA INIT (WITH FALLBACK FIX) ---
    async function initCamera() {
      if (videoStream) videoStream.getTracks().forEach(track => track.stop());
      
      try {
        // Attempt 1: Try requested camera (usually rear 'environment')
        videoStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: currentFacingMode, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        cameraFeed.srcObject = videoStream;
        document.getElementById('cameraErrorMsg').classList.add('hidden');
      } catch (err) { 
        console.warn(`Camera access failed for facingMode: ${currentFacingMode}. Trying fallback...`, err); 
        
        try {
          // Attempt 2: Fallback to any available camera (Webcam on desktop)
          videoStream = await navigator.mediaDevices.getUserMedia({
            video: { width: { ideal: 1920 }, height: { ideal: 1080 } },
            audio: false
          });
          cameraFeed.srcObject = videoStream;
          document.getElementById('cameraErrorMsg').classList.add('hidden');
        } catch (fallbackErr) {
          // Attempt 3: Complete failure
          console.error("All camera access failed:", fallbackErr);
          document.getElementById('cameraErrorMsg').classList.remove('hidden');
        }
      }
      loadGalleryThumbnail();
    }

    document.getElementById('switchCameraBtn').addEventListener('click', () => {
      currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
      initCamera();
    });

    // --- IMAGE CAPTURE & UPLOAD ---
    function prepareGarmentSelection(source, originalWidth, originalHeight) {
      const MAX_SIZE = 512;
      let width = originalWidth; let height = originalHeight;
      
      if (width > height) { if (width > MAX_SIZE) { height = Math.round(height * (MAX_SIZE / width)); width = MAX_SIZE; } } 
      else { if (height > MAX_SIZE) { width = Math.round(width * (MAX_SIZE / height)); height = MAX_SIZE; } }

      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = width; tempCanvas.height = height;
      const ctx = tempCanvas.getContext('2d');
      ctx.drawImage(source, 0, 0, width, height);
      
      currentOriginalDataUrl = tempCanvas.toDataURL('image/jpeg', 0.8);
      document.getElementById('capturedThumb').src = currentOriginalDataUrl;
      
      selectedGarmentBase64 = null;
      document.getElementById('generateTryOnBtn').disabled = true;
      document.getElementById('searchInput').value = '';
      
      loadGarments();
      garmentSelectView.classList.remove('hidden');
      garmentSelectView.classList.add('fade-in');
    }

    document.getElementById('captureBtn').addEventListener('click', () => {
      if(!cameraFeed.videoWidth) return alert("Camera not ready. Please use the upload button.");
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = cameraFeed.videoWidth; tempCanvas.height = cameraFeed.videoHeight;
      tempCanvas.getContext('2d').drawImage(cameraFeed, 0, 0);
      prepareGarmentSelection(tempCanvas, tempCanvas.width, tempCanvas.height);
    });

    document.getElementById('uploadBtn').addEventListener('click', () => document.getElementById('fileInput').click());
    document.getElementById('fileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => prepareGarmentSelection(img, img.width, img.height);
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('cancelSelectBtn').addEventListener('click', () => {
      garmentSelectView.classList.add('hidden');
      document.getElementById('fileInput').value = '';
    });

    // --- ADD GARMENT UI ---
    document.getElementById('openAddGarmentBtn').addEventListener('click', () => {
      addGarmentView.classList.remove('hidden');
      addGarmentView.classList.add('fade-in');
    });
    
    document.getElementById('closeAddGarmentBtn').addEventListener('click', () => {
      addGarmentView.classList.add('hidden');
    });

    const garmentPreviewContainer = document.getElementById('garmentPreviewContainer');
    const garmentFileInput = document.getElementById('garmentFileInput');
    const garmentPreviewImg = document.getElementById('garmentPreviewImg');
    const garmentPreviewIcon = document.getElementById('garmentPreviewIcon');
    let newGarmentDataUrl = null;

    garmentPreviewContainer.addEventListener('click', () => garmentFileInput.click());
    garmentFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        newGarmentDataUrl = event.target.result;
        garmentPreviewImg.src = newGarmentDataUrl;
        garmentPreviewImg.classList.remove('hidden');
        garmentPreviewIcon.classList.add('hidden');
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('saveGarmentBtn').addEventListener('click', async () => {
      const name = document.getElementById('garmentNameInput').value.trim();
      if(!name || !newGarmentDataUrl) return alert("Please provide both a name and an image.");
      
      const btn = document.getElementById('saveGarmentBtn');
      const originalHTML = btn.innerHTML;
      btn.innerHTML = `<div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>`;
      
      try {
        const blob = await convertToWebP(newGarmentDataUrl);
        const path = `garment_${Date.now()}.webp`;
        
        await supabaseClient.storage.from('garments').upload(path, blob, { contentType: 'image/webp' });
        await supabaseClient.from('garments').insert([{ name: name, image_path: path }]);
        
        addGarmentView.classList.add('hidden');
        document.getElementById('garmentNameInput').value = '';
        garmentPreviewImg.classList.add('hidden');
        garmentPreviewIcon.classList.remove('hidden');
        newGarmentDataUrl = null;
        
      } catch (err) {
        alert("Upload failed: " + err.message);
      } finally {
        btn.innerHTML = originalHTML;
      }
    });

    // --- GARMENT SELECTION LOGIC ---
    async function loadGarments() {
      const grid = document.getElementById('garmentsGrid');
      grid.innerHTML = Array(9).fill(`<div class="aspect-square bg-gray-800 rounded-xl animate-pulse"></div>`).join('');
      
      const { data, error } = await supabaseClient.from('garments').select('*').order('created_at', { ascending: false });
      if(error) return console.error(error);
      
      allGarments = data;
      renderGarments(allGarments);
    }

    function renderGarments(garments) {
      const grid = document.getElementById('garmentsGrid');
      grid.innerHTML = '';
      
      garments.forEach(g => {
        const url = supabaseClient.storage.from('garments').getPublicUrl(g.image_path).data.publicUrl;
        const div = document.createElement('div');
        div.className = "relative aspect-square bg-gray-800 rounded-xl overflow-hidden cursor-pointer transition-transform";
        div.innerHTML = `
          <img src="${url}" class="w-full h-full object-cover pointer-events-none" loading="lazy" crossorigin="anonymous" />
          <div class="absolute bottom-0 inset-x-0 bg-black bg-opacity-60 text-center p-1 text-[10px] font-bold text-white truncate pointer-events-none">${g.name}</div>
        `;
        
        div.onclick = async () => {
          Array.from(grid.children).forEach(c => c.classList.remove('garment-selected'));
          div.classList.add('garment-selected');
          
          const response = await fetch(url);
          const blob = await response.blob();
          const reader = new FileReader();
          reader.onloadend = () => {
            selectedGarmentBase64 = reader.result.split(',')[1];
            document.getElementById('generateTryOnBtn').disabled = false;
          };
          reader.readAsDataURL(blob);
        };
        grid.appendChild(div);
      });
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = allGarments.filter(g => g.name.toLowerCase().includes(term));
      renderGarments(filtered);
    });

    // --- GENERATION & AUTO-SAVE (WITH 500 ERROR FIX) ---
    document.getElementById('generateTryOnBtn').addEventListener('click', async () => {
      if(!selectedGarmentBase64) return;
      
      const base64Image = currentOriginalDataUrl.split(',')[1];
      const btn = document.getElementById('generateTryOnBtn');

      processingView.classList.remove('hidden');
      processingView.classList.add('fade-in');
      let seconds = 0;
      const timerText = document.getElementById('timerText');
      timerText.textContent = `Styling... 0s`;
      const timer = setInterval(() => { seconds++; timerText.textContent = `Styling... ${seconds}s`; }, 1000);

      try {
        // FIX FOR 500 ERROR: 
        // Your Netlify backend is coded to look for a variable named "mask".
        // Instead of renaming it to referenceImage and breaking your backend, 
        // we pass the suit image AS the "mask" variable. 
        // The prompt tells the AI to use it as a reference image instead of a drawing mask!
       const response = await fetch('/.netlify/functions/tryon', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            prompt: VIRTUAL_TRY_ON_PROMPT, 
            image: base64Image, 
            mask: selectedGarmentBase64, 
            model: 'gemini-3.1-flash-image' 
          })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Server error");

        const candidateParts = data.candidates?.[0]?.content?.parts || [];
        let generatedImgSrc = null;

        candidateParts.forEach((part) => {
          const inlineImg = part.inlineData || part.inline_data;
          if (inlineImg && inlineImg.data) {
            generatedImgSrc = `data:${inlineImg.mimeType || 'image/jpeg'};base64,${inlineImg.data}`;
          }
        });

        if (!generatedImgSrc) throw new Error("No image data returned from AI.");

        timerText.textContent = `Auto-Saving to Gallery...`;
        
        // AUTO-SAVE LOGIC
        const timestamp = Date.now();
        const origPath = `original_${timestamp}.webp`;
        const genPath = `generated_${timestamp}.webp`;

        const origBlob = await convertToWebP(currentOriginalDataUrl);
        const genBlob = await convertToWebP(generatedImgSrc);

        await Promise.all([
          supabaseClient.storage.from('photos').upload(origPath, origBlob, { contentType: 'image/webp' }),
          supabaseClient.storage.from('photos').upload(genPath, genBlob, { contentType: 'image/webp' })
        ]);

        const { data: insertedData } = await supabaseClient.from('gallery').insert([{ original_image_path: origPath, generated_image_path: genPath }]).select();

        isViewingGalleryItem = false;
        currentActiveDocId = insertedData[0].id;
        currentActiveOrigPath = origPath;
        currentActiveGenPath = genPath;

        document.getElementById('closeComparisonBtn').textContent = "Retake";
        setupSliderDimensions(currentOriginalDataUrl, generatedImgSrc);
        loadGalleryThumbnail();

      } catch (err) {
        const originalText = btn.innerHTML;
        btn.textContent = "Failed - Try Again";
        btn.classList.remove('bg-blue-600');
        btn.classList.add('bg-red-600');
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.classList.add('bg-blue-600');
          btn.classList.remove('bg-red-600');
        }, 3000);
      } finally {
        clearInterval(timer);
        processingView.classList.add('hidden');
        processingView.classList.remove('fade-in');
      }
    });

    // --- BUG-FREE SLIDER INITIALIZATION ---
    function setupSliderDimensions(origSrc, genSrc) {
      const origImg = document.getElementById('imgOriginal');
      const genImg = document.getElementById('imgGenerated');
      const container = document.getElementById('compareContainer');

      let loadedCount = 0;
      
      const onImagesLoaded = () => {
        const screenW = window.innerWidth - 32; 
        const screenH = window.innerHeight * 0.6; 
        const imgW = genImg.naturalWidth || 512;
        const imgH = genImg.naturalHeight || 512;

        const scale = Math.min(screenW / imgW, screenH / imgH);
        const finalW = Math.round(imgW * scale);
        const finalH = Math.round(imgH * scale);

        container.style.width = finalW + "px";
        container.style.height = finalH + "px";
        
        origImg.style.width = finalW + "px";
        origImg.style.height = finalH + "px";
        
        genImg.style.width = finalW + "px";
        genImg.style.height = finalH + "px";

        garmentSelectView.classList.add('hidden');
        libraryView.classList.add('hidden');
        comparisonView.classList.remove('hidden');
        comparisonView.classList.add('fade-in');
        
        setTimeout(initComparisons, 50);
      };

      const checkLoad = () => {
        loadedCount++;
        if (loadedCount === 2) onImagesLoaded();
      };

      origImg.removeAttribute('src');
      genImg.removeAttribute('src');
      
      origImg.onload = checkLoad;
      genImg.onload = checkLoad;
      
      origImg.src = origSrc;
      genImg.src = genSrc;
    }

    // --- REWRITTEN SLIDER LOGIC ---
    function initComparisons() {
      const container = document.getElementById('compareContainer');
      const overlay = document.getElementById('imgOverlayWrapper');
      const slider = document.getElementById('sliderHandle');

      let isSliding = false;
      
      const initialWidth = container.offsetWidth / 2;
      overlay.style.width = initialWidth + "px";
      slider.style.left = initialWidth + "px";

      function slide(e) {
        if (!isSliding) return;
        if(e.cancelable) e.preventDefault(); 

        let clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
        const rect = container.getBoundingClientRect();
        let x = clientX - rect.left;

        if (x < 0) x = 0;
        if (x > rect.width) x = rect.width;

        overlay.style.width = x + "px";
        slider.style.left = x + "px";
      }

      container.addEventListener('mousedown', (e) => { isSliding = true; slide(e); });
      window.addEventListener('mouseup', () => { isSliding = false; });
      window.addEventListener('mousemove', slide);

      container.addEventListener('touchstart', (e) => { isSliding = true; slide(e); }, { passive: false });
      window.addEventListener('touchend', () => { isSliding = false; });
      window.addEventListener('touchmove', slide, { passive: false });
    }

    // --- WEBP CONVERSION UTILITY ---
    async function convertToWebP(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'Anonymous'; 
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          canvas.toBlob((blob) => {
            resolve(blob);
          }, 'image/webp', 0.8);
        };
        img.onerror = reject;
        img.src = src;
      });
    }

    // --- DELETE / DOWNLOAD / CLOSE ---
    document.getElementById('deleteBtn').addEventListener('click', async () => {
      if(!confirm("Delete this try-on from your gallery?")) return;
      
      const btn = document.getElementById('deleteBtn');
      const originalHTML = btn.innerHTML;
      btn.innerHTML = `<div class="w-5 h-5 border-2 border-red-500 border-t-transparent rounded-full animate-spin"></div>`;

      try {
        const { error: dbError } = await supabaseClient.from('gallery').delete().eq('id', currentActiveDocId);
        if (dbError) throw dbError;

        await supabaseClient.storage.from('photos').remove([currentActiveOrigPath, currentActiveGenPath]);
        
        comparisonView.classList.add('hidden');
        if(isViewingGalleryItem) libraryView.classList.remove('hidden');
        loadGallery();
        loadGalleryThumbnail();
      } catch (err) {
        alert("Failed to delete. Ensure you updated Supabase SQL policies.");
      } finally {
        btn.innerHTML = originalHTML;
      }
    });

    document.getElementById('downloadBtn').addEventListener('click', async () => {
      try {
        const imgSrc = document.getElementById('imgGenerated').src;
        const response = await fetch(imgSrc);
        const blob = await response.blob();
        
        const blobUrl = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = blobUrl;
        link.download = `VirtualTryOn_${Date.now()}.webp`;
        
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(blobUrl);
      } catch (err) {
        alert("Failed to download image.");
      }
    });

    document.getElementById('closeComparisonBtn').addEventListener('click', () => {
      comparisonView.classList.add('hidden');
      if(isViewingGalleryItem) {
        libraryView.classList.remove('hidden');
      }
    });

    // --- LIBRARY & GALLERY ---
    document.getElementById('openLibraryBtn').addEventListener('click', () => {
      libraryView.classList.remove('hidden');
      libraryView.classList.add('fade-in');
      loadGallery();
    });
    document.getElementById('closeLibraryBtn').addEventListener('click', () => libraryView.classList.add('hidden'));

    async function loadGalleryThumbnail() {
      const { data } = await supabaseClient.from('gallery').select('generated_image_path').order('created_at', { ascending: false }).limit(1);
      if (data && data.length > 0) {
        const { data: { publicUrl } } = supabaseClient.storage.from('photos').getPublicUrl(data[0].generated_image_path);
        const btn = document.getElementById('openLibraryBtn');
        btn.style.backgroundImage = `url('${publicUrl}')`;
      } else {
        document.getElementById('openLibraryBtn').style.backgroundImage = 'none';
      }
    }

    async function loadGallery() {
      const grid = document.getElementById('galleryGrid');
      grid.innerHTML = Array(12).fill(`<div class="aspect-square bg-gray-900 animate-pulse"></div>`).join('');
      
      const { data: docs, error } = await supabaseClient.from('gallery').select('*').order('created_at', { ascending: false });
      
      if (!error && docs) {
        grid.innerHTML = '';
        docs.forEach(doc => {
          const genUrl = supabaseClient.storage.from('photos').getPublicUrl(doc.generated_image_path).data.publicUrl;
          const origUrl = supabaseClient.storage.from('photos').getPublicUrl(doc.original_image_path).data.publicUrl;
          
          const div = document.createElement('div');
          div.className = "aspect-square bg-gray-900 relative cursor-pointer active:opacity-50 transition-opacity";
          div.innerHTML = `<img src="${genUrl}" class="w-full h-full object-cover" loading="lazy" />`;
          
          div.onclick = () => {
            isViewingGalleryItem = true;
            currentActiveDocId = doc.id;
            currentActiveOrigPath = doc.original_image_path;
            currentActiveGenPath = doc.generated_image_path;
            
            document.getElementById('closeComparisonBtn').textContent = "Back";
            setupSliderDimensions(origUrl, genUrl);
          };
          
          grid.appendChild(div);
        });
      }
    }

    window.onload = initCamera;
  </script>
</body>

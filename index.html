<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="AI Virtual Hairstyle Try-On & Studio" />
  <title>HAIR LAB — Editorial AI Hairstyle Studio</title>

  <!-- Google Fonts: Editorial Sans & Clean Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    /* ==========================================================================
       DESIGN SYSTEM (Based on design(2).md: Premium Editorial Skincare & AI Studio)
       ========================================================================== */
    :root {
      /* Neutral Palette */
      --bg: #F1F2F4;
      --surface: #FFFFFF;
      --surface-soft: #E8E9EC;
      --text: #050505;
      --text-secondary: #66686D;
      --text-muted: #8B8D92;
      --border: #D7D8DB;
      --border-subtle: rgba(0, 0, 0, 0.06);
      --black: #000000;
      --white: #FFFFFF;

      /* Pastel Data Accents */
      --lime: #C8D94E;
      --pink: #D99ABC;
      --cyan: #88DAD5;
      --lavender: #C7A8D9;
      --yellow: #D8E27A;
      --peach: #E8B39E;

      /* Glass Panels */
      --glass-bg: rgba(255, 255, 255, 0.78);
      --glass-dark: rgba(15, 15, 18, 0.72);
      --glass-border: rgba(255, 255, 255, 0.45);

      /* Typography */
      --font-display: 'Space Grotesk', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;

      /* Radii */
      --radius-sm: 10px;
      --radius-md: 18px;
      --radius-lg: 24px;
      --radius-xl: 32px;
      --radius-pill: 999px;

      /* Elevation */
      --shadow-soft: 0 8px 30px rgba(0, 0, 0, 0.04);
      --shadow-float: 0 16px 40px rgba(0, 0, 0, 0.08);

      /* Safe Areas */
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      overflow: hidden;
      touch-action: manipulation;
      -webkit-font-smoothing: antialiased;
      position: fixed;
      inset: 0;
    }

    /* Screen Views */
    .view-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
      transition: opacity 0.28s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.28s;
      z-index: 10;
    }
    .view-screen.active {
      opacity: 1;
      pointer-events: auto;
      visibility: visible;
      z-index: 20;
    }

    /* Typography */
    h1, h2, h3, h4 {
      font-family: var(--font-display);
      letter-spacing: -0.03em;
      line-height: 1.05;
      font-weight: 700;
    }
    .text-muted { color: var(--text-muted); }
    .hidden { display: none !important; }

    /* ==========================================================================
       BUTTONS & CONTROLS (design(2).md specification)
       ========================================================================== */
    button {
      background: none;
      border: none;
      cursor: pointer;
      font-family: var(--font-body);
      font-weight: 600;
      outline: none;
      transition: transform 0.15s ease, opacity 0.15s ease, background 0.15s ease;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; }

    /* Primary Pill */
    .btn-pill-primary {
      background: var(--black);
      color: var(--white);
      height: 52px;
      padding: 0 28px;
      border-radius: var(--radius-pill);
      font-size: 0.95rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      letter-spacing: 0.02em;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.12);
    }

    /* Secondary Neutral Pill */
    .btn-pill-secondary {
      background: var(--surface);
      color: var(--text);
      height: 44px;
      padding: 0 20px;
      border-radius: var(--radius-pill);
      font-size: 0.88rem;
      font-weight: 600;
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* Circular Icon Button */
    .btn-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-pill);
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      box-shadow: var(--shadow-soft);
      flex-shrink: 0;
    }

    /* ==========================================================================
       VIEW 1: CAMERA & CAPTURE
       ========================================================================== */
    .camera-viewport {
      position: absolute;
      inset: 0;
      background: var(--black);
      overflow: hidden;
    }
    #cameraVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .editorial-header {
      position: absolute;
      top: calc(var(--safe-top) + 16px);
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 30;
    }
    .brand-mark {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 8px 16px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-title {
      font-family: var(--font-display);
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .brand-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--lime);
    }

    .capture-dock {
      position: absolute;
      bottom: calc(var(--safe-bottom) + 24px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--glass-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      padding: 8px 16px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      gap: 20px;
      box-shadow: var(--shadow-float);
      z-index: 30;
    }

    .shutter-ring {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 3px solid var(--black);
      padding: 4px;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .shutter-core {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--black);
      transition: transform 0.15s ease;
    }
    .shutter-ring:active .shutter-core { transform: scale(0.9); }

    /* ==========================================================================
       VIEW 2: HAIRSTYLE STUDIO & CATALOGUE
       ========================================================================== */
    .studio-header {
      padding: calc(var(--safe-top) + 14px) 20px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 25;
    }
    .studio-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Client Preview Bar */
    .client-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg);
      border-radius: var(--radius-md);
      padding: 8px 12px;
      border: 1px solid var(--border);
    }
    .client-avatar {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid var(--border);
    }
    .search-box {
      position: relative;
      flex: 1;
    }
    .search-box input {
      width: 100%;
      height: 40px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 0 16px 0 36px;
      font-size: 0.85rem;
      font-family: var(--font-body);
      color: var(--text);
      outline: none;
    }
    .search-box i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Category Pill Slider */
    .category-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 0 6px;
      scrollbar-width: none;
    }
    .category-scroll::-webkit-scrollbar { display: none; }
    .cat-chip {
      white-space: nowrap;
      padding: 8px 16px;
      border-radius: var(--radius-pill);
      background: var(--surface-soft);
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-secondary);
      border: 1px solid transparent;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .cat-chip.active {
      background: var(--black);
      color: var(--white);
    }

    /* Hairstyle Grid */
    .catalog-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px calc(var(--safe-bottom) + 110px);
    }
    .hairstyles-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }
    @media (min-width: 768px) {
      .hairstyles-grid { grid-template-columns: repeat(4, 1fr); gap: 18px; }
    }

    /* Individual Style Card */
    .hair-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 140px;
      position: relative;
      cursor: pointer;
      box-shadow: var(--shadow-soft);
      transition: all 0.2s ease;
    }
    .hair-card:hover { border-color: var(--black); }
    .hair-card.selected {
      border: 2px solid var(--black);
      background: #FAFBFB;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.07);
    }
    .hair-card.selected::after {
      content: '\F26E';
      font-family: "bootstrap-icons";
      position: absolute;
      top: 10px;
      right: 10px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--black);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
    }

    .hair-tag {
      font-size: 0.65rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 3px 8px;
      border-radius: var(--radius-pill);
      align-self: flex-start;
      margin-bottom: 8px;
    }
    .hair-title {
      font-size: 1.05rem;
      font-family: var(--font-display);
      font-weight: 700;
      line-height: 1.15;
      color: var(--text);
      margin-bottom: 6px;
    }
    .hair-desc {
      font-size: 0.75rem;
      color: var(--text-secondary);
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Fixed Floating Apply Footer */
    .studio-action-dock {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(180deg, rgba(241, 242, 244, 0) 0%, rgba(241, 242, 244, 0.98) 40%, rgba(241, 242, 244, 1) 100%);
      padding: 16px 20px calc(var(--safe-bottom) + 16px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      z-index: 30;
    }
    .selected-summary {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .selected-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    .selected-name {
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 700;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    /* ==========================================================================
       VIEW 3: PROCESSING OVERLAY
       ========================================================================== */
    .processing-modal {
      position: absolute;
      inset: 0;
      background: var(--glass-dark);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      text-align: center;
      z-index: 100;
      color: var(--white);
    }
    .metric-ring-container {
      position: relative;
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    .spinner-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      animation: rotateRing 2s linear infinite;
    }
    @keyframes rotateRing { 100% { transform: rotate(360deg); } }

    /* ==========================================================================
       VIEW 4: COMPARISON & RESULT VIEW
       ========================================================================== */
    .compare-stage {
      flex: 1;
      position: relative;
      background: #0D0E10;
      overflow: hidden;
      touch-action: none;
    }
    .stage-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }
    #imgRendered {
      clip-path: polygon(50% 0, 100% 0, 100% 100%, 50% 100%);
    }

    .slider-divider {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 44px;
      transform: translateX(-50%);
      cursor: ew-resize;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 40;
    }
    .divider-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--white);
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.4);
    }
    .divider-pill {
      position: relative;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--white);
      color: var(--black);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    }

    .view-mode-pill {
      display: flex;
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      padding: 4px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--glass-border);
    }
    .mode-tab {
      padding: 6px 16px;
      border-radius: var(--radius-pill);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-secondary);
    }
    .mode-tab.active {
      background: var(--black);
      color: var(--white);
    }

    /* Toast Notifications */
    .toast-layer {
      position: fixed;
      top: calc(var(--safe-top) + 20px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .editorial-toast {
      background: var(--black);
      color: var(--white);
      padding: 12px 22px;
      border-radius: var(--radius-pill);
      font-size: 0.88rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: var(--shadow-float);
      animation: toastIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <!-- Toast Notification Hub -->
  <div id="toastHub" class="toast-layer"></div>

  <!-- =========================================================================
       VIEW 1: CAMERA & LIVE CAPTURE
       ========================================================================= -->
  <section id="cameraScreen" class="view-screen active">
    <div class="editorial-header">
      <div class="brand-mark">
        <span class="brand-indicator"></span>
        <span class="brand-title">HAIR LAB 2026</span>
      </div>
      <div style="display: flex; gap: 8px;">
        <button id="triggerUploadBtn" class="btn-icon" aria-label="Upload Photo"><i class="bi bi-arrow-up-circle"></i></button>
        <button id="flipCameraBtn" class="btn-icon" aria-label="Flip Camera"><i class="bi bi-camera-reverse"></i></button>
        <input type="file" id="photoInput" class="hidden" accept="image/*" />
      </div>
    </div>

    <div class="camera-viewport">
      <video id="cameraVideo" autoplay playsinline muted></video>
    </div>

    <div class="capture-dock">
      <button id="shutterBtn" class="shutter-ring" aria-label="Capture Photo">
        <div class="shutter-core"></div>
      </button>
    </div>
  </section>

  <!-- =========================================================================
       VIEW 2: HAIRSTYLE LIBRARY & SELECTION STUDIO
       ========================================================================= -->
  <section id="studioScreen" class="view-screen">
    <header class="studio-header">
      <div class="studio-top-row">
        <button id="backToCaptureBtn" class="btn-pill-secondary"><i class="bi bi-arrow-left"></i> RETAKE</button>
        <h3>HAIRSTYLE CATALOGUE</h3>
        <div style="width: 80px;"></div>
      </div>

      <!-- User Reference Bar & Instant Search -->
      <div class="client-bar">
        <img id="clientReferenceThumb" class="client-avatar" src="" alt="Client Reference" />
        <div class="search-box">
          <i class="bi bi-search"></i>
          <input type="text" id="hairSearchInput" placeholder="Search 50 styles (e.g. Butterfly, Paranda, Juda)..." autocomplete="off" />
        </div>
      </div>

      <!-- Filter Chips -->
      <div class="category-scroll" id="categoryScroll">
        <button class="cat-chip active" data-filter="all">All (50)</button>
        <button class="cat-chip" data-filter="punjabi">Punjabi & Wedding</button>
        <button class="cat-chip" data-filter="modern">Modern Cuts</button>
        <button class="cat-chip" data-filter="open">Open & Blowouts</button>
        <button class="cat-chip" data-filter="buns">Buns & Juda</button>
        <button class="cat-chip" data-filter="braids">Braids</button>
        <button class="cat-chip" data-filter="ponytail">Ponytails</button>
        <button class="cat-chip" data-filter="bob">Bob & Short</button>
      </div>
    </header>

    <!-- 50 Hairstyle Grid -->
    <main class="catalog-content">
      <div id="hairstylesGrid" class="hairstyles-grid"></div>
    </main>

    <!-- Sticky Apply Bar -->
    <div class="studio-action-dock">
      <div class="selected-summary">
        <span class="selected-label">Selected Style</span>
        <span id="selectedHairLabel" class="selected-name">Select a hairstyle</span>
      </div>
      <button id="applyHairstyleBtn" class="btn-pill-primary" disabled>
        APPLY HAIRSTYLE <i class="bi bi-stars"></i>
      </button>
    </div>
  </section>

  <!-- =========================================================================
       VIEW 3: PROCESSING MODAL
       ========================================================================= -->
  <div id="processingModal" class="processing-modal hidden">
    <div class="metric-ring-container">
      <svg class="spinner-svg" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6" />
        <circle cx="50" cy="50" r="44" fill="none" stroke="var(--lime)" stroke-width="6" stroke-dasharray="80 200" stroke-linecap="round" />
      </svg>
      <i class="bi bi-scissors" style="font-size: 2rem; color: var(--lime);"></i>
    </div>
    <h2 style="font-size: 2rem; margin-bottom: 8px;">STYLING...</h2>
    <p id="timerDisplay" style="color: rgba(255,255,255,0.7); font-size: 0.95rem; font-weight: 500;">Preserving face geometry & lighting (0s)</p>
  </div>

  <!-- =========================================================================
       VIEW 4: COMPARISON & RESULT VIEWER
       ========================================================================= -->
  <section id="compareScreen" class="view-screen">
    <header class="editorial-header" style="position: relative; top: 0; left: 0; right: 0; padding: calc(var(--safe-top) + 12px) 20px 12px; background: var(--surface);">
      <button id="compareBackBtn" class="btn-pill-secondary"><i class="bi bi-chevron-left"></i> STYLES</button>
      <div class="view-mode-pill">
        <button id="modeSplitBtn" class="mode-tab active">SPLIT</button>
        <button id="modeSingleBtn" class="mode-tab">RESULT</button>
      </div>
      <button id="downloadResultBtn" class="btn-pill-primary" style="height: 40px; padding: 0 18px; font-size: 0.82rem;">SAVE <i class="bi bi-download"></i></button>
    </header>

    <div id="compareStage" class="compare-stage">
      <img id="imgSource" class="stage-img" alt="Original Client" />
      <img id="imgRendered" class="stage-img" alt="Virtual Hairstyle Applied" />

      <div id="sliderDivider" class="slider-divider">
        <div class="divider-line"></div>
        <div class="divider-pill"><i class="bi bi-arrows-collapse"></i></div>
      </div>
    </div>
  </section>

  <!-- =========================================================================
       APPLICATION LOGIC & 50 HAIRSTYLE DATABASE
       ========================================================================= -->
  <script>
    // --- TOP 50 HAIRSTYLE LIBRARY ---
    const HAIRSTYLES_LIBRARY = [
      // 1. Modern cuts
      { id: 'butterfly-cut', name: 'Butterfly Cut', category: 'modern', tag: 'Trending', color: 'var(--lime)', desc: 'Voluminous cascading layers with chin-length framing.', promptDetail: 'butterfly cut with bouncy 90s blowout layers, voluminous crown, and soft face-framing fringe' },
      { id: 'long-layered-cut', name: 'Long Layered Cut', category: 'modern', tag: 'Classic', color: 'var(--peach)', desc: 'Graceful elongated layers providing fluid movement.', promptDetail: 'soft seamless long layered cut, natural root lift and flowing tapered ends' },
      { id: 'face-framing-layers', name: 'Face-Framing Layers', category: 'modern', tag: 'Sculpting', color: 'var(--cyan)', desc: 'Curated layers accentuating cheekbones and jawline.', promptDetail: 'delicate face-framing layers hugging cheekbones and jawline with fluid soft texture' },
      { id: 'feather-cut', name: 'Feather Cut', category: 'modern', tag: 'Volume', color: 'var(--lavender)', desc: 'Classic outward feathered layers with airy texture.', promptDetail: 'classic outward feathered cut with bouncy airy ends and polished finish' },
      { id: 'curtain-bangs', name: 'Curtain Bangs', category: 'modern', tag: 'Framing', color: 'var(--pink)', desc: 'Center-parted swooping bangs blending into length.', promptDetail: 'chic curtain bangs parted in the center, framing both eyes with long subtle layers' },

      { id: 'sleek-low-bun', name: 'Sleek Low Bun', category: 'buns', tag: 'Clean Girl', color: 'var(--cyan)', desc: 'Sculpted chignon sitting neatly at the nape.', promptDetail: 'sleek low chignon bun parted neatly in the center with glossy sculpted finish' },
      { id: 'high-bun', name: 'High Bun', category: 'buns', tag: 'Formal', color: 'var(--lavender)', desc: 'Regal ballerina-inspired high rounded bun.', promptDetail: 'voluminous polished high ballerina bun centered smoothly on the crown' },
      { id: 'classic-juda', name: 'Classic Juda', category: 'buns', tag: 'Traditional', color: 'var(--peach)', desc: 'Time-honored Indian structured bun for sarees & suits.', promptDetail: 'traditional Indian structured bridal juda bun firmly secured at mid-crown' },
      { id: 'gajra-juda', name: 'Gajra Juda', category: 'buns', tag: 'Festive', color: 'var(--pink)', desc: 'Low circular bun encased in fresh white jasmine gajra.', promptDetail: 'traditional low Indian bridal bun densely encircled by fresh fragrant white jasmine gajra flowers' },
      { id: 'mogra-bun', name: 'Mogra Bun', category: 'buns', tag: 'Bridal', color: 'var(--lime)', desc: 'Layered bun bordered with fresh mogra floral wreaths.', promptDetail: 'sculpted royal Indian bridal juda lavishly adorned with authentic fresh mogra buds' },

      // 6. Braids
      { id: 'classic-three-strand-braid', name: 'Classic Three-Strand Braid', category: 'braids', tag: 'Staple', color: 'var(--cyan)', desc: 'Even, symmetric traditional three-strand braid.', promptDetail: 'neat classic three-strand braid with smooth consistent tension and natural finish' },
      { id: 'french-braid', name: 'French Braid', category: 'braids', tag: 'Sculpted', color: 'var(--lavender)', desc: 'Interwoven braid starting neatly at the hairline.', promptDetail: 'flawless classic French braid incorporating hair smoothly from crown to tail' },
      { id: 'fishtail-braid', name: 'Fishtail Braid', category: 'braids', tag: 'Boho', color: 'var(--peach)', desc: 'Intricate micro-strand weave pulled softly for volume.', promptDetail: 'intricate bohemian fishtail braid gently pulled apart for thick textured dimension' },
      { id: 'dutch-braid', name: 'Dutch Braid', category: 'braids', tag: '3D Effect', color: 'var(--lime)', desc: 'Inverted reverse braid creating high-relief ridges.', promptDetail: 'raised 3D Dutch braid running symmetrically down with defined bold weave' },
      { id: 'crown-braid', name: 'Crown Braid', category: 'braids', tag: 'Regal', color: 'var(--pink)', desc: 'Halo braid encircling the crown like a tiara.', promptDetail: 'ethereal crown halo braid wrapped smoothly around the head with soft romantic texture' },
      { id: 'side-braid', name: 'Side Braid', category: 'braids', tag: 'Relaxed', color: 'var(--yellow)', desc: 'Gentle over-the-shoulder asymmetrical braid.', promptDetail: 'soft romantic side braid draped over the shoulder with relaxed face-framing tendrils' },
      { id: 'half-up-braid', name: 'Half-Up Braid', category: 'braids', tag: 'Half-Up', color: 'var(--cyan)', desc: 'Braided crown accent with open flowing hair beneath.', promptDetail: 'half-up crown braid pinned at the back with long flowing soft waves underneath' },

      // 7. Punjabi / Indian (Punjab & Ludhiana Pride)
      { id: 'punjabi-gutt-choti', name: 'Punjabi Gutt / Choti', category: 'punjabi', tag: 'Iconic Punjab', color: 'var(--lime)', desc: 'Traditional long Punjabi plait with neat center part.', promptDetail: 'authentic Punjabi gutt (choti) tightly braided with high shine and traditional Punjabi silhouette' },
      { id: 'punjabi-paranda-braid', name: 'Punjabi Paranda Braid', category: 'punjabi', tag: 'Ludhiana Special', color: 'var(--pink)', desc: 'Braid interwoven with colorful tassels and golden parandi.', promptDetail: 'traditional Punjabi braid intricately woven with a vibrant ornamental Paranda featuring gold tassels, mirror-work, and silk threads' },
      { id: 'gota-choti', name: 'Gota Choti', category: 'punjabi', tag: 'Jaggo Festive', color: 'var(--yellow)', desc: 'Laced with shimmering metallic gold gota ribbons.', promptDetail: 'Punjabi festive braid wrapped and criss-crossed with shimmering metallic golden gota patti ribbon' },
      { id: 'punjabi-bridal-braid', name: 'Punjabi Bridal Braid', category: 'punjabi', tag: 'Anand Karaj', color: 'var(--peach)', desc: 'Opulent thick braid with gold clips, pearls, & florals.', promptDetail: 'luxurious Punjabi bridal braid embellished with gold jewelry clips, baby pearls, and fresh flowers' },
      { id: 'floral-gajra-braid', name: 'Floral / Gajra Braid', category: 'punjabi', tag: 'Mehendi Glam', color: 'var(--cyan)', desc: 'Elongated braid entwined with baby’s breath & roses.', promptDetail: 'long textured bridal braid entwined with cascading baby’s breath (gypsophila) and delicate mini roses' },

      // 8. Half-up / bridal / party
      { id: 'half-up-half-down', name: 'Half-Up Half-Down', category: 'bridal', tag: 'Versatile', color: 'var(--lavender)', desc: 'Pinned crown height with cascading open body.', promptDetail: 'elegant half-up half-down hairstyle with soft crown bouffant and glossy cascading waves' },
      { id: 'bridal-half-up-curls', name: 'Bridal Half-Up Curls', category: 'bridal', tag: 'Cocktail Night', color: 'var(--pink)', desc: 'Textured twists pinned to accommodate maang tikka.', promptDetail: 'opulent bridal half-up hairstyle with intricate twisted crown pinned for maang tikka, cascading into voluminous glamorous barrel curls' }
    ];

    // --- APPLICATION STATE ---
    let cameraStream = null;
    let cameraFacingMode = 'user';
    let clientOriginalBase64 = null;
    let selectedHairstyle = null;
    let activeFilter = 'all';
    let isSplitView = true;

    // --- DOM REFERENCES ---
    const cameraScreen = document.getElementById('cameraScreen');
    const studioScreen = document.getElementById('studioScreen');
    const compareScreen = document.getElementById('compareScreen');
    const processingModal = document.getElementById('processingModal');

    const cameraVideo = document.getElementById('cameraVideo');
    const shutterBtn = document.getElementById('shutterBtn');
    const flipCameraBtn = document.getElementById('flipCameraBtn');
    const triggerUploadBtn = document.getElementById('triggerUploadBtn');
    const photoInput = document.getElementById('photoInput');

    const clientReferenceThumb = document.getElementById('clientReferenceThumb');
    const hairSearchInput = document.getElementById('hairSearchInput');
    const categoryScroll = document.getElementById('categoryScroll');
    const hairstylesGrid = document.getElementById('hairstylesGrid');
    const selectedHairLabel = document.getElementById('selectedHairLabel');
    const applyHairstyleBtn = document.getElementById('applyHairstyleBtn');
    const backToCaptureBtn = document.getElementById('backToCaptureBtn');

    const imgSource = document.getElementById('imgSource');
    const imgRendered = document.getElementById('imgRendered');
    const sliderDivider = document.getElementById('sliderDivider');
    const compareStage = document.getElementById('compareStage');
    const modeSplitBtn = document.getElementById('modeSplitBtn');
    const modeSingleBtn = document.getElementById('modeSingleBtn');
    const compareBackBtn = document.getElementById('compareBackBtn');
    const downloadResultBtn = document.getElementById('downloadResultBtn');
    const timerDisplay = document.getElementById('timerDisplay');

    // --- VIEW SWITCHER ---
    function navigateTo(screen) {
      [cameraScreen, studioScreen, compareScreen].forEach(s => s.classList.remove('active'));
      screen.classList.add('active');
    }

    function showToast(msg) {
      const hub = document.getElementById('toastHub');
      const toast = document.createElement('div');
      toast.className = 'editorial-toast';
      toast.innerHTML = `<i class="bi bi-info-circle"></i> ${msg}`;
      hub.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-10px)';
        setTimeout(() => toast.remove(), 250);
      }, 2800);
    }

    // --- CAMERA INITIALIZATION ---
    async function startCamera() {
      if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: cameraFacingMode, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        cameraVideo.srcObject = cameraStream;
      } catch (err) {
        try {
          cameraStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          cameraVideo.srcObject = cameraStream;
        } catch (e) {
          showToast("Camera access unavailable. Please upload a photo.");
        }
      }
    }

    flipCameraBtn.addEventListener('click', () => {
      cameraFacingMode = cameraFacingMode === 'user' ? 'environment' : 'user';
      startCamera();
    });

    // --- CAPTURE & UPLOAD WORKFLOW ---
    function processClientPhoto(dataUrl) {
      clientOriginalBase64 = dataUrl;
      clientReferenceThumb.src = dataUrl;
      imgSource.src = dataUrl;
      navigateTo(studioScreen);
      renderHairstyles();
    }

    shutterBtn.addEventListener('click', () => {
      if (!cameraVideo.videoWidth) {
        showToast("Camera not ready. Upload a photo instead.");
        return;
      }
      const canvas = document.createElement('canvas');
      canvas.width = cameraVideo.videoWidth;
      canvas.height = cameraVideo.videoHeight;
      canvas.getContext('2d').drawImage(cameraVideo, 0, 0);
      processClientPhoto(canvas.toDataURL('image/jpeg', 0.92));
    });

    triggerUploadBtn.addEventListener('click', () => photoInput.click());

    photoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => {
          const maxDim = 1920;
          let w = img.width, h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
            else { w = Math.round((w * maxDim) / h); h = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          processClientPhoto(canvas.toDataURL('image/jpeg', 0.92));
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    });

    backToCaptureBtn.addEventListener('click', () => {
      navigateTo(cameraScreen);
      startCamera();
    });

    // --- HAIRSTYLE CATALOGUE RENDERING ---
    function renderHairstyles() {
      const query = hairSearchInput.value.toLowerCase().trim();
      hairstylesGrid.innerHTML = '';

      const filtered = HAIRSTYLES_LIBRARY.filter(style => {
        const matchesCategory = (activeFilter === 'all') || (style.category === activeFilter);
        const matchesQuery = style.name.toLowerCase().includes(query) || style.desc.toLowerCase().includes(query);
        return matchesCategory && matchesQuery;
      });

      if (filtered.length === 0) {
        hairstylesGrid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 40px; color: var(--text-muted);">No matching hairstyles found.</div>`;
        return;
      }

      filtered.forEach(style => {
        const card = document.createElement('div');
        card.className = `hair-card ${selectedHairstyle?.id === style.id ? 'selected' : ''}`;
        card.innerHTML = `
          <div class="hair-tag" style="background:${style.color}; color:#000;">${style.tag}</div>
          <div class="hair-title">${style.name}</div>
          <div class="hair-desc">${style.desc}</div>
        `;
        card.onclick = () => {
          selectedHairstyle = style;
          selectedHairLabel.textContent = style.name;
          applyHairstyleBtn.disabled = false;
          renderHairstyles();
        };
        hairstylesGrid.appendChild(card);
      });
    }

    // Filter Chips Event
    categoryScroll.addEventListener('click', (e) => {
      if (e.target.classList.contains('cat-chip')) {
        document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
        e.target.classList.add('active');
        activeFilter = e.target.getAttribute('data-filter');
        renderHairstyles();
      }
    });

    // Debounced Search Input
    let searchDebounce;
    hairSearchInput.addEventListener('input', () => {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(renderHairstyles, 180);
    });

    // --- AI PROMPT BUILDER & EXECUTION ---
    function composeVirtualHairPrompt(style) {
      return `Apply the "${style.name}" hairstyle onto the person in the photo.
### Strict Identity & Pose Preservation:
* Keep the person's exact face, identity, eyes, eyebrows, nose, lips, jawline, teeth, and skin tone 100% untouched.
* Maintain the exact camera angle, head position, tilt, neck position, and lighting direction.
* Keep the entire background, clothing, earrings, necklace, bindi, and outfit completely identical and intact.
* Do not regenerate or smooth the facial skin texture.
### Hairstyle Application Details:
* Replace only the existing hair with a realistic ${style.name} (${style.promptDetail}).
* Hair must show hyper-realistic individual human strands, natural roots along the hairline, realistic scalp attachment, realistic volume, and natural soft flyaways.
* The hair must conform seamlessly to the person's exact head shape and shoulders.`;
    }

    applyHairstyleBtn.addEventListener('click', async () => {
      if (!selectedHairstyle || !clientOriginalBase64) return;

      processingModal.classList.remove('hidden');
      let seconds = 0;
      timerDisplay.textContent = `Preserving face geometry & lighting (0s)`;
      const interval = setInterval(() => {
        seconds++;
        timerDisplay.textContent = `Synthesizing ${selectedHairstyle.name} (${seconds}s)`;
      }, 1000);

      const rawBase64 = clientOriginalBase64.split(',')[1];
      const prompt = composeVirtualHairPrompt(selectedHairstyle);

      try {
        const response = await fetch('/api/tryon', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            prompt: prompt,
            image: rawBase64,
            model: 'gemini-3.1-flash-image'
          })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Generation endpoint error");

        let generatedImage = null;
        const parts = data.candidates?.[0]?.content?.parts || [];
        for (const part of parts) {
          const inline = part.inlineData || part.inline_data;
          if (inline && inline.data) {
            generatedImage = `data:${inline.mimeType || 'image/jpeg'};base64,${inline.data}`;
            break;
          }
        }

        if (!generatedImage) throw new Error("No image data returned from AI model.");

        imgRendered.src = generatedImage;
        setupSplitViewer();
        navigateTo(compareScreen);
        showToast(`${selectedHairstyle.name} applied successfully!`);

      } catch (err) {
        console.error(err);
        showToast("Styling failed. Please verify API configuration.");
      } finally {
        clearInterval(interval);
        processingModal.classList.add('hidden');
      }
    });

    // --- BEFORE / AFTER SPLIT SLIDER ---
    let isDraggingSlider = false;

    function setupSplitViewer() {
      setSplitMode(true);
      imgRendered.style.clipPath = `polygon(50% 0, 100% 0, 100% 100%, 50% 100%)`;
      sliderDivider.style.left = `50%`;
    }

    function setSplitMode(split) {
      isSplitView = split;
      if (split) {
        modeSplitBtn.classList.add('active');
        modeSingleBtn.classList.remove('active');
        sliderDivider.style.display = 'flex';
        imgRendered.style.clipPath = `polygon(50% 0, 100% 0, 100% 100%, 50% 100%)`;
        sliderDivider.style.left = `50%`;
      } else {
        modeSplitBtn.classList.remove('active');
        modeSingleBtn.classList.add('active');
        sliderDivider.style.display = 'none';
        imgRendered.style.clipPath = `polygon(0 0, 100% 0, 100% 100%, 0 100%)`;
      }
    }

    modeSplitBtn.addEventListener('click', () => setSplitMode(true));
    modeSingleBtn.addEventListener('click', () => setSplitMode(false));

    function updateSlider(clientX) {
      if (!isSplitView) return;
      const rect = compareStage.getBoundingClientRect();
      let offsetX = clientX - rect.left;
      offsetX = Math.max(0, Math.min(offsetX, rect.width));
      const percentage = (offsetX / rect.width) * 100;
      imgRendered.style.clipPath = `polygon(${percentage}% 0, 100% 0, 100% 100%, ${percentage}% 100%)`;
      sliderDivider.style.left = `${percentage}%`;
    }

    compareStage.addEventListener('mousedown', (e) => { isDraggingSlider = true; updateSlider(e.clientX); });
    window.addEventListener('mouseup', () => { isDraggingSlider = false; });
    window.addEventListener('mousemove', (e) => { if (isDraggingSlider) updateSlider(e.clientX); });

    compareStage.addEventListener('touchstart', (e) => { isDraggingSlider = true; updateSlider(e.touches[0].clientX); }, { passive: true });
    window.addEventListener('touchend', () => { isDraggingSlider = false; });
    window.addEventListener('touchmove', (e) => { if (isDraggingSlider) updateSlider(e.touches[0].clientX); }, { passive: true });

    compareBackBtn.addEventListener('click', () => navigateTo(studioScreen));

    downloadResultBtn.addEventListener('click', () => {
      const a = document.createElement('a');
      a.href = imgRendered.src;
      a.download = `HairLab_${selectedHairstyle?.id || 'result'}_${Date.now()}.jpg`;
      a.click();
      showToast("Look saved to device!");
    });

    // --- APP STARTUP ---
    window.addEventListener('DOMContentLoaded', () => {
      startCamera();
    });
  </script>

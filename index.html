<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tooth Fairy-Inpainting</title>
  <link href="./output.css" rel="stylesheet">
  <!-- Supabase Web SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Prevent pull-to-refresh & make it feel like a native iOS app */
    body { overscroll-behavior-y: contain; background-color: #000; color: #fff; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    
    /* Camera UI Elements */
    .shutter-btn {
      width: 76px; height: 76px; border-radius: 50%; background-color: white;
      border: 4px solid #000; outline: 3px solid white; transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .shutter-btn:active { transform: scale(0.85); }
    
    /* Canvas & Masking */
    #canvasContainer { position: relative; display: flex; justify-content: center; align-items: center; max-width: 100%; border-radius: 12px; overflow: hidden; background: #111; }
    #baseCanvas, #maskCanvas { display: block; max-width: 100%; height: auto; touch-action: none; }
    #maskCanvas { position: absolute; top: 0; left: 0; cursor: crosshair; opacity: 0.55; }
    
    /* Animations */
    .fade-in { animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Custom Range Slider */
    input[type=range] { -webkit-appearance: none; background: transparent; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%; background: #ffffff; cursor: pointer; margin-top: -8px; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
    input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #4b5563; border-radius: 2px; }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col font-sans antialiased selection:bg-transparent">

  <!-- VIEW 1: Camera Interface -->
  <div id="cameraView" class="absolute inset-0 flex flex-col justify-between z-10">
    <div class="h-24 bg-black bg-opacity-80 flex justify-between items-end pb-4 px-6 relative z-20 backdrop-blur-md">
      <div class="w-10"></div>
      <span class="text-xs font-bold tracking-widest text-yellow-400">PHOTO</span>
      <button id="uploadBtn" class="w-10 h-10 flex items-center justify-center bg-gray-800 bg-opacity-70 rounded-full active:scale-90 transition-transform">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
      </button>
      <input type="file" id="fileInput" class="hidden" accept="image/*" />
    </div>
    
    <div class="relative flex-1 bg-black flex items-center justify-center overflow-hidden">
      <video id="cameraFeed" class="absolute w-full h-full object-cover" autoplay playsinline></video>
      <canvas id="captureCanvas" class="hidden"></canvas>
    </div>

    <div class="h-40 bg-black bg-opacity-90 flex items-center justify-around px-6 pb-8 backdrop-blur-md">
      <button id="openLibraryBtn" class="w-14 h-14 rounded-xl overflow-hidden bg-gray-800 shadow-lg border border-gray-700 active:scale-95 transition-transform bg-cover bg-center"></button>
      <button id="captureBtn" class="shutter-btn shadow-2xl"></button>
      <button id="switchCameraBtn" class="w-14 h-14 flex items-center justify-center bg-gray-800 bg-opacity-60 rounded-full active:scale-95 transition-transform">
        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
      </button>
    </div>
  </div>

  <!-- VIEW 2: Masking Editor -->
  <div id="editorView" class="hidden absolute inset-0 bg-gray-950 z-20 flex flex-col">
    <div class="h-16 flex items-center justify-between px-4 mt-safe border-b border-gray-800">
      <button id="cancelEditBtn" class="text-white text-lg active:opacity-50">Cancel</button>
      <span class="text-sm font-semibold tracking-widest uppercase">Mask</span>
      <button id="clearMaskBtn" class="text-blue-400 font-medium active:opacity-50">Clear</button>
    </div>
    
    <div class="flex-1 flex flex-col items-center justify-start p-4 overflow-y-auto space-y-6">
      <p class="text-xs text-gray-400 uppercase tracking-wider text-center">Draw over the area to repair</p>
      
      <div id="canvasContainer" class="shadow-2xl">
        <canvas id="baseCanvas"></canvas>
        <canvas id="maskCanvas"></canvas>
      </div>

      <div class="w-full max-w-md space-y-4 bg-gray-900 p-4 rounded-2xl border border-gray-800">
        <div class="flex items-center space-x-4">
          <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
          <input type="range" id="brushSize" min="5" max="50" value="20" class="flex-1" />
        </div>
        
        <!-- PROMPT PRESETS -->
        <div class="flex space-x-3 w-full pt-2">
          <button id="presetImplants" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold border-2 border-blue-400 transition active:scale-95">🦷 Implants</button>
          <button id="presetBraces" class="flex-1 bg-gray-800 text-gray-300 py-3 rounded-xl font-bold border-2 border-transparent transition active:scale-95">🪥 Braces</button>
        </div>
        
        <button id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition active:scale-95 mt-2">
          Generate Magic
        </button>
      </div>
    </div>
  </div>

  <!-- VIEW 3: Processing Overlay -->
  <div id="processingView" class="hidden absolute inset-0 bg-black bg-opacity-90 backdrop-blur-xl z-40 flex flex-col items-center justify-center space-y-5">
    <div class="w-14 h-14 border-4 border-gray-700 border-t-blue-500 rounded-full animate-spin"></div>
    <p id="timerText" class="text-lg font-medium text-white tracking-widest uppercase">Enhancing... 0s</p>
  </div>

  <!-- VIEW 4: Comparison Slider -->
  <div id="comparisonView" class="hidden absolute inset-0 bg-black z-30 flex flex-col">
    <div class="h-20 flex items-end justify-between px-5 pb-3">
      <button id="closeComparisonBtn" class="text-white text-lg active:opacity-50">Back</button>
      <span class="text-sm font-semibold tracking-widest uppercase text-gray-300">Result</span>
      
      <!-- Contextual Action Buttons -->
      <div class="flex items-center space-x-4">
        <button id="deleteBtn" class="hidden text-red-500 active:opacity-50 p-1 flex items-center justify-center min-w-[24px]">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
        </button>
        <button id="downloadBtn" class="hidden text-blue-400 active:opacity-50 p-1">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
        </button>
        <button id="saveToLibraryBtn" class="text-yellow-400 font-bold text-lg active:opacity-50 min-w-[40px]">Save</button>
      </div>
    </div>
    
    <div class="flex-1 flex items-center justify-center p-4">
      <!-- BUG-FREE SLIDER ARCHITECTURE -->
      <div id="compareContainer" class="relative mx-auto rounded-2xl select-none bg-gray-900 shadow-2xl" style="touch-action: none;">
        <img id="imgOriginal" class="block rounded-2xl w-full h-full pointer-events-none" draggable="false" />
        <div id="imgOverlayWrapper" class="absolute top-0 left-0 h-full overflow-hidden rounded-2xl z-10" style="width: 50%;">
          <img id="imgGenerated" class="block rounded-2xl h-full pointer-events-none max-w-none" draggable="false" />
        </div>
        <div id="sliderHandle" class="absolute top-0 bottom-0 flex flex-col items-center justify-center cursor-ew-resize z-20" style="left: 50%; transform: translateX(-50%); width: 40px;">
          <div class="absolute top-0 bottom-0 w-1 bg-white shadow-md z-10"></div>
          <div class="relative w-10 h-10 bg-white rounded-full shadow-lg flex items-center justify-center z-20">
            <svg class="w-6 h-6 text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l4-4 4 4m0 6l-4 4-4-4"></path></svg>
          </div>
        </div>
      </div>
    </div>
    <p class="text-center text-xs text-gray-500 pb-10 uppercase tracking-widest font-medium">Slide to compare</p>
  </div>

  <!-- VIEW 5: Library Gallery -->
  <div id="libraryView" class="hidden absolute inset-0 bg-black z-50 flex flex-col">
    <div class="h-20 flex items-end justify-between px-4 pb-3 border-b border-gray-900 bg-gray-950 mt-safe">
      <button id="closeLibraryBtn" class="text-blue-400 flex items-center space-x-1 text-lg active:opacity-50">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        <span>Camera</span>
      </button>
      <span class="text-sm font-semibold tracking-widest uppercase">Gallery</span>
      <div class="w-20"></div>
    </div>
    <div class="flex-1 overflow-y-auto p-1 bg-black">
      <div id="galleryGrid" class="grid grid-cols-3 gap-1"></div>
    </div>
  </div>

  <script>
    // --- SUPABASE CONFIGURATION ---
    const SUPABASE_URL = 'https://lqfzvedrpzihdtmwcdyk.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxxZnp2ZWRycHppaGR0bXdjZHlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2MjE2MjUsImV4cCI6MjEwMjE5NzYyNX0.ZXf3hYfr-qWiUxVhbQA9_VymeoTEoGLHoS8ou8xzCOQ';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // --- STATE & DOM ---
    let videoStream = null;
    let currentFacingMode = 'environment';
    let isDrawing = false;
    let currentOriginalDataUrl = null; 
    
    let activePromptType = 'implants'; 
    const PROMPTS = {
      implants: "Repair the masked teeth to look like healthy, real working teeth. Fix rotten or broken areas naturally. Strictly match the exact lighting, perspective, shadows, and overall mood of the original photo. CRITICAL: Generate a low resolution 512px image focusing purely on realistic textures to save compute.",
      braces: "Add realistic, high-quality dental braces to the masked teeth. Ensure brackets and wires look natural and anatomically correct. Strictly match the exact lighting, perspective, shadows, and overall mood of the original photo. CRITICAL: Generate a low resolution 512px image focusing purely on realistic textures to save compute."
    };

    let isViewingGalleryItem = false;
    let currentActiveDocId = null;
    let currentActiveOrigPath = null;
    let currentActiveGenPath = null;

    const cameraFeed = document.getElementById('cameraFeed');
    const captureCanvas = document.getElementById('captureCanvas');
    const baseCanvas = document.getElementById('baseCanvas');
    const maskCanvas = document.getElementById('maskCanvas');
    const baseCtx = baseCanvas.getContext('2d');
    const maskCtx = maskCanvas.getContext('2d');
    
    const [cameraView, editorView, processingView, comparisonView, libraryView] = 
      ['cameraView', 'editorView', 'processingView', 'comparisonView', 'libraryView'].map(id => document.getElementById(id));

    // --- CAMERA INIT ---
    async function initCamera() {
      if (videoStream) videoStream.getTracks().forEach(track => track.stop());
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: currentFacingMode, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        cameraFeed.srcObject = videoStream;
      } catch (err) { console.error("Camera error:", err); }
      loadGalleryThumbnail();
    }

    document.getElementById('switchCameraBtn').addEventListener('click', () => {
      currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
      initCamera();
    });

    // --- PROMPT TOGGLES ---
    const btnImplants = document.getElementById('presetImplants');
    const btnBraces = document.getElementById('presetBraces');

    btnImplants.addEventListener('click', () => {
      activePromptType = 'implants';
      btnImplants.className = "flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold border-2 border-blue-400 transition active:scale-95";
      btnBraces.className = "flex-1 bg-gray-800 text-gray-300 py-3 rounded-xl font-bold border-2 border-transparent transition active:scale-95";
    });

    btnBraces.addEventListener('click', () => {
      activePromptType = 'braces';
      btnBraces.className = "flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold border-2 border-blue-400 transition active:scale-95";
      btnImplants.className = "flex-1 bg-gray-800 text-gray-300 py-3 rounded-xl font-bold border-2 border-transparent transition active:scale-95";
    });

    // --- IMAGE CAPTURE (Strict 512px) ---
    function prepareEditor(source, originalWidth, originalHeight) {
      const MAX_SIZE = 512;
      let width = originalWidth;
      let height = originalHeight;
      
      if (width > height) { if (width > MAX_SIZE) { height = Math.round(height * (MAX_SIZE / width)); width = MAX_SIZE; } } 
      else { if (height > MAX_SIZE) { width = Math.round(width * (MAX_SIZE / height)); height = MAX_SIZE; } }

      baseCanvas.width = width; baseCanvas.height = height;
      maskCanvas.width = width; maskCanvas.height = height;

      baseCtx.drawImage(source, 0, 0, width, height);
      currentOriginalDataUrl = baseCanvas.toDataURL('image/jpeg', 0.8);
      
      clearMask();
      editorView.classList.remove('hidden');
      editorView.classList.add('fade-in');
    }

    document.getElementById('captureBtn').addEventListener('click', () => {
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = cameraFeed.videoWidth; tempCanvas.height = cameraFeed.videoHeight;
      tempCanvas.getContext('2d').drawImage(cameraFeed, 0, 0);
      prepareEditor(tempCanvas, tempCanvas.width, tempCanvas.height);
    });

    document.getElementById('uploadBtn').addEventListener('click', () => document.getElementById('fileInput').click());
    document.getElementById('fileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => prepareEditor(img, img.width, img.height);
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('cancelEditBtn').addEventListener('click', () => {
      editorView.classList.add('hidden');
      document.getElementById('fileInput').value = '';
    });

    // --- MASKING LOGIC ---
    function clearMask() {
      maskCtx.fillStyle = 'black'; 
      maskCtx.fillRect(0, 0, maskCanvas.width, maskCanvas.height);
    }
    document.getElementById('clearMaskBtn').addEventListener('click', clearMask);

    function getMousePos(canvas, evt) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      let clientX = evt.clientX; let clientY = evt.clientY;
      if(evt.touches && evt.touches.length > 0) {
        clientX = evt.touches[0].clientX; clientY = evt.touches[0].clientY;
      }
      return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
    }

    function startDrawing(e) { e.preventDefault(); isDrawing = true; draw(e); }
    function stopDrawing(e) { e.preventDefault(); isDrawing = false; maskCtx.beginPath(); }
    function draw(e) {
      if (!isDrawing) return;
      e.preventDefault(); 
      const pos = getMousePos(maskCanvas, e);
      maskCtx.lineWidth = document.getElementById('brushSize').value;
      maskCtx.lineCap = 'round';
      maskCtx.strokeStyle = 'white'; 
      maskCtx.lineTo(pos.x, pos.y);
      maskCtx.stroke();
      maskCtx.beginPath();
      maskCtx.moveTo(pos.x, pos.y);
    }

    maskCanvas.addEventListener('mousedown', startDrawing);
    maskCanvas.addEventListener('mousemove', draw);
    maskCanvas.addEventListener('mouseup', stopDrawing);
    maskCanvas.addEventListener('mouseout', stopDrawing);
    maskCanvas.addEventListener('touchstart', startDrawing, {passive: false});
    maskCanvas.addEventListener('touchmove', draw, {passive: false});
    maskCanvas.addEventListener('touchend', stopDrawing);

    // --- GENERATION (NETLIFY API) ---
    document.getElementById('submitBtn').addEventListener('click', async () => {
      const promptToUse = PROMPTS[activePromptType];
      const base64Image = baseCanvas.toDataURL('image/jpeg', 0.8).split(',')[1];
      const base64Mask = maskCanvas.toDataURL('image/jpeg', 1.0).split(',')[1];
      const submitBtn = document.getElementById('submitBtn');

      processingView.classList.remove('hidden');
      processingView.classList.add('fade-in');
      let seconds = 0;
      const timerText = document.getElementById('timerText');
      timerText.textContent = `Enhancing... 0s`;
      const timer = setInterval(() => { seconds++; timerText.textContent = `Enhancing... ${seconds}s`; }, 1000);

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 150000); 

      try {
        const response = await fetch('/.netlify/functions/inpaint', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: promptToUse, image: base64Image, mask: base64Mask, model: 'gemini-3.1-flash-image' }),
          signal: controller.signal
        });

        clearTimeout(timeoutId);
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Server error");

        const candidateParts = data.candidates?.[0]?.content?.parts || [];
        let generatedImgSrc = null;

        candidateParts.forEach((part) => {
          const inlineImg = part.inlineData || part.inline_data;
          if (inlineImg && inlineImg.data) {
            generatedImgSrc = `data:${inlineImg.mimeType || 'image/jpeg'};base64,${inlineImg.data}`;
          }
        });

        if (!generatedImgSrc) throw new Error("No image data returned from AI.");

        isViewingGalleryItem = false;
        document.getElementById('saveToLibraryBtn').classList.remove('hidden');
        document.getElementById('deleteBtn').classList.add('hidden');
        document.getElementById('downloadBtn').classList.add('hidden');
        document.getElementById('closeComparisonBtn').textContent = "Retake";

        setupSliderDimensions(currentOriginalDataUrl, generatedImgSrc);

      } catch (err) {
        const originalText = submitBtn.innerHTML;
        submitBtn.textContent = "Failed - Try Again";
        submitBtn.classList.remove('bg-blue-600', 'hover:bg-blue-500');
        submitBtn.classList.add('bg-red-600');
        setTimeout(() => {
          submitBtn.innerHTML = originalText;
          submitBtn.classList.add('bg-blue-600', 'hover:bg-blue-500');
          submitBtn.classList.remove('bg-red-600');
        }, 3000);
      } finally {
        clearInterval(timer);
        processingView.classList.add('hidden');
        processingView.classList.remove('fade-in');
      }
    });

    // --- BUG-FREE SLIDER INITIALIZATION ---
    function setupSliderDimensions(origSrc, genSrc) {
      const origImg = document.getElementById('imgOriginal');
      const genImg = document.getElementById('imgGenerated');
      const container = document.getElementById('compareContainer');

      let loadedCount = 0;
      
      const onImagesLoaded = () => {
        const screenW = window.innerWidth - 32; 
        const screenH = window.innerHeight * 0.6; 
        const imgW = genImg.naturalWidth || 512;
        const imgH = genImg.naturalHeight || 512;

        const scale = Math.min(screenW / imgW, screenH / imgH);
        const finalW = Math.round(imgW * scale);
        const finalH = Math.round(imgH * scale);

        container.style.width = finalW + "px";
        container.style.height = finalH + "px";
        
        origImg.style.width = finalW + "px";
        origImg.style.height = finalH + "px";
        
        genImg.style.width = finalW + "px";
        genImg.style.height = finalH + "px";

        editorView.classList.add('hidden');
        libraryView.classList.add('hidden');
        comparisonView.classList.remove('hidden');
        comparisonView.classList.add('fade-in');
        
        setTimeout(initComparisons, 50);
      };

      const checkLoad = () => {
        loadedCount++;
        if (loadedCount === 2) onImagesLoaded();
      };

      origImg.removeAttribute('src');
      genImg.removeAttribute('src');
      
      origImg.onload = checkLoad;
      genImg.onload = checkLoad;
      
      origImg.src = origSrc;
      genImg.src = genSrc;
    }

    // --- REWRITTEN SLIDER LOGIC ---
    function initComparisons() {
      const container = document.getElementById('compareContainer');
      const overlay = document.getElementById('imgOverlayWrapper');
      const slider = document.getElementById('sliderHandle');

      let isSliding = false;
      
      const initialWidth = container.offsetWidth / 2;
      overlay.style.width = initialWidth + "px";
      slider.style.left = initialWidth + "px";

      function slide(e) {
        if (!isSliding) return;
        if(e.cancelable) e.preventDefault(); 

        let clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
        const rect = container.getBoundingClientRect();
        let x = clientX - rect.left;

        if (x < 0) x = 0;
        if (x > rect.width) x = rect.width;

        overlay.style.width = x + "px";
        slider.style.left = x + "px";
      }

      container.addEventListener('mousedown', (e) => { isSliding = true; slide(e); });
      window.addEventListener('mouseup', () => { isSliding = false; });
      window.addEventListener('mousemove', slide);

      container.addEventListener('touchstart', (e) => { isSliding = true; slide(e); }, { passive: false });
      window.addEventListener('touchend', () => { isSliding = false; });
      window.addEventListener('touchmove', slide, { passive: false });
    }

    // --- WEBP CONVERSION UTILITY ---
    async function convertToWebP(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'Anonymous'; 
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          canvas.toBlob((blob) => {
            resolve(blob);
          }, 'image/webp', 0.8);
        };
        img.onerror = reject;
        img.src = src;
      });
    }

    // --- SAVE / DELETE / DOWNLOAD / CLOSE ---
    document.getElementById('saveToLibraryBtn').addEventListener('click', async () => {
      const btn = document.getElementById('saveToLibraryBtn');
      const originalHTML = btn.innerHTML;
      btn.innerHTML = `<div class="w-5 h-5 border-2 border-yellow-400 border-t-transparent rounded-full animate-spin"></div>`;
      
      try {
        const timestamp = Date.now();
        const origPath = `original_${timestamp}.webp`;
        const genPath = `generated_${timestamp}.webp`;

        const origSrc = document.getElementById('imgOriginal').src;
        const genSrc = document.getElementById('imgGenerated').src;

        const origBlob = await convertToWebP(origSrc);
        const genBlob = await convertToWebP(genSrc);

        await Promise.all([
          supabaseClient.storage.from('photos').upload(origPath, origBlob, { contentType: 'image/webp' }),
          supabaseClient.storage.from('photos').upload(genPath, genBlob, { contentType: 'image/webp' })
        ]);

        await supabaseClient.from('gallery').insert([{ original_image_path: origPath, generated_image_path: genPath }]);

        comparisonView.classList.add('hidden');
        loadGalleryThumbnail();
      } catch (err) {
        alert("Failed to save: " + err.message);
      } finally {
        btn.innerHTML = originalHTML;
      }
    });

    document.getElementById('deleteBtn').addEventListener('click', async () => {
      if(!confirm("Delete this image forever?")) return;
      
      const btn = document.getElementById('deleteBtn');
      const originalHTML = btn.innerHTML;
      btn.innerHTML = `<div class="w-5 h-5 border-2 border-red-500 border-t-transparent rounded-full animate-spin"></div>`;

      try {
        const { error: dbError } = await supabaseClient.from('gallery').delete().eq('id', currentActiveDocId);
        if (dbError) throw dbError;

        const { error: storageError } = await supabaseClient.storage.from('photos').remove([currentActiveOrigPath, currentActiveGenPath]);
        if (storageError) throw storageError;
        
        comparisonView.classList.add('hidden');
        libraryView.classList.remove('hidden');
        loadGallery();
        loadGalleryThumbnail();
      } catch (err) {
        alert("Failed to delete. Ensure you updated Supabase SQL policies. Error: " + err.message);
      } finally {
        btn.innerHTML = originalHTML;
      }
    });

    document.getElementById('downloadBtn').addEventListener('click', async () => {
      try {
        const imgSrc = document.getElementById('imgGenerated').src;
        const response = await fetch(imgSrc);
        const blob = await response.blob();
        
        const blobUrl = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = blobUrl;
        link.download = `CodeInBlack_Result_${Date.now()}.webp`;
        
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(blobUrl);
      } catch (err) {
        alert("Failed to download image.");
      }
    });

    document.getElementById('closeComparisonBtn').addEventListener('click', () => {
      comparisonView.classList.add('hidden');
      if(isViewingGalleryItem) {
        libraryView.classList.remove('hidden');
      }
    });

    // --- LIBRARY & GALLERY ---
    document.getElementById('openLibraryBtn').addEventListener('click', () => {
      libraryView.classList.remove('hidden');
      libraryView.classList.add('fade-in');
      loadGallery();
    });
    document.getElementById('closeLibraryBtn').addEventListener('click', () => libraryView.classList.add('hidden'));

    async function loadGalleryThumbnail() {
      const { data } = await supabaseClient.from('gallery').select('generated_image_path').order('created_at', { ascending: false }).limit(1);
      if (data && data.length > 0) {
        const { data: { publicUrl } } = supabaseClient.storage.from('photos').getPublicUrl(data[0].generated_image_path);
        const btn = document.getElementById('openLibraryBtn');
        btn.style.backgroundImage = `url('${publicUrl}')`;
      } else {
        document.getElementById('openLibraryBtn').style.backgroundImage = 'none';
      }
    }

    async function loadGallery() {
      const grid = document.getElementById('galleryGrid');
      grid.innerHTML = Array(12).fill(`<div class="aspect-square bg-gray-900 animate-pulse"></div>`).join('');
      
      const { data: docs, error } = await supabaseClient.from('gallery').select('*').order('created_at', { ascending: false });
      
      if (!error && docs) {
        grid.innerHTML = '';
        docs.forEach(doc => {
          const genUrl = supabaseClient.storage.from('photos').getPublicUrl(doc.generated_image_path).data.publicUrl;
          const origUrl = supabaseClient.storage.from('photos').getPublicUrl(doc.original_image_path).data.publicUrl;
          
          const div = document.createElement('div');
          div.className = "aspect-square bg-gray-900 relative cursor-pointer active:opacity-50 transition-opacity";
          div.innerHTML = `<img src="${genUrl}" class="w-full h-full object-cover" loading="lazy" />`;
          
          div.onclick = () => {
            isViewingGalleryItem = true;
            currentActiveDocId = doc.id;
            currentActiveOrigPath = doc.original_image_path;
            currentActiveGenPath = doc.generated_image_path;
            
            document.getElementById('saveToLibraryBtn').classList.add('hidden');
            document.getElementById('deleteBtn').classList.remove('hidden');
            document.getElementById('downloadBtn').classList.remove('hidden');
            document.getElementById('closeComparisonBtn').textContent = "Back";

            setupSliderDimensions(origUrl, genUrl);
          };
          
          grid.appendChild(div);
        });
      }
    }

    window.onload = initCamera;
  </script>
</body>
</html>

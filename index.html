<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>KAMI Hair Color Tester</title>

  <!-- Google Font & Bootstrap Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root {
      --primary: #FF6422;
      --primary-hover: #E85517;
      --primary-light: #FFF0EB;
      --bg: #141414;
      --surface: #1E1E1E;
      --surface-subtle: #2A2A2A;
      --text: #FFFFFF;
      --text-muted: #A3A3A3;
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    /* TOP HEADER */
    header {
      padding: max(12px, env(safe-area-inset-top)) 16px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      flex-shrink: 0;
    }

    .logo {
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .logo::after {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--primary);
    }

    .btn-upload {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .btn-upload:active { transform: scale(0.96); }

    /* PREVIEW CONTAINER */
    .preview-stage {
      flex: 1;
      min-height: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      overflow: hidden;
    }

    .canvas-wrap {
      position: relative;
      max-width: 100%;
      max-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      background: #000;
    }

    canvas {
      max-width: 100%;
      max-height: 48dvh;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
      color: var(--text-muted);
      cursor: pointer;
      padding: 30px;
      border: 2px dashed rgba(255,255,255,0.2);
      border-radius: var(--radius);
      width: 85%;
      height: 260px;
    }
    .empty-state i { font-size: 2.8rem; color: var(--primary); }
    .empty-state span { font-size: 0.88rem; font-weight: 600; }

    .btn-hold {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0,0,0,0.65);
      border: 1px solid rgba(255,255,255,0.2);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #fff;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }
    .btn-hold:active { background: var(--primary); }

    /* CONTROLS DECK */
    .controls-deck {
      background: var(--surface);
      border-top: 1px solid rgba(255,255,255,0.08);
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 14px 14px max(14px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-shrink: 0;
    }

    .swatches-scroll {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .swatches-scroll::-webkit-scrollbar { display: none; }

    .swatch-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      cursor: pointer;
      flex-shrink: 0;
    }
    .swatch-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid transparent;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      position: relative;
    }
    .swatch-btn.active .swatch-circle {
      border-color: #fff;
      transform: scale(1.08);
    }
    .swatch-label {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--text-muted);
      max-width: 54px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .swatch-btn.active .swatch-label { color: #fff; }

    /* SLIDERS */
    .sliders-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: var(--surface-subtle);
      padding: 10px 12px;
      border-radius: 14px;
    }
    .slider-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .slider-box label {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }
    .slider-box label span { color: var(--primary); }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: #444;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--primary);
      cursor: pointer;
    }

    #fileInput { display: none; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="app-shell">
    <header>
      <div class="logo">KAMI TEST</div>
      <button class="btn-upload" id="uploadBtn">
        <i class="bi bi-image"></i> UPLOAD PHOTO
      </button>
      <input type="file" id="fileInput" accept="image/*" />
    </header>

    <main class="preview-stage">
      <div id="emptyBox" class="empty-state">
        <i class="bi bi-person-bounding-box"></i>
        <span>Tap to upload a selfie photo<br/>(Camera or Gallery)</span>
      </div>

      <div id="canvasWrap" class="canvas-wrap hidden">
        <canvas id="mainCanvas"></canvas>
        <button id="holdOriginalBtn" class="btn-hold" type="button">HOLD ORIGINAL</button>
      </div>
    </main>

    <footer class="controls-deck">
      <!-- SWATCHES -->
      <div class="swatches-scroll" id="swatchList"></div>

      <!-- FINE-TUNE SLIDERS -->
      <div class="sliders-row">
        <div class="slider-box">
          <label>VIBRANCY <span id="chromaDisplay">24</span></label>
          <input type="range" id="chromaSlider" min="5" max="55" step="1" value="24" />
        </div>
        <div class="slider-box">
          <label>LIGHTNESS <span id="liftDisplay">0</span></label>
          <input type="range" id="liftSlider" min="-25" max="30" step="1" value="0" />
        </div>
      </div>
    </footer>
  </div>

  <script type="module">
    // --- 1. CIE L*a*b* COLOR CONVERSION ENGINE ---
    const SRGB_TO_LIN = new Float32Array(256);
    for (let i = 0; i < 256; i++) {
      const c = i / 255.0;
      SRGB_TO_LIN[i] = (c <= 0.04045) ? (c / 12.92) : Math.pow((c + 0.055) / 1.055, 2.4);
    }
    const LIN_TO_SRGB_LUT = new Uint8Array(4097);
    for (let i = 0; i <= 4096; i++) {
      const c = i / 4096;
      const s = (c <= 0.0031308) ? (12.92 * c) : (1.055 * Math.pow(c, 1.0 / 2.4) - 0.055);
      LIN_TO_SRGB_LUT[i] = Math.max(0, Math.min(255, Math.round(s * 255.0)));
    }
    function fastLinToSRGB(c) {
      if (c <= 0) return 0;
      if (c >= 1) return 255;
      return LIN_TO_SRGB_LUT[(c * 4096 + 0.5) | 0];
    }

    const D65_XN = 0.95047, D65_YN = 1.00000, D65_ZN = 1.08883;
    const LAB_EPS = 0.008856, LAB_KAPPA = 7.787, LAB_DELTA = 0.206896;

    function sRGBToLab(r, g, b) {
      const lr = SRGB_TO_LIN[r], lg = SRGB_TO_LIN[g], lb = SRGB_TO_LIN[b];
      const x = (0.4124564 * lr + 0.3575761 * lg + 0.1804375 * lb) / D65_XN;
      const y = (0.2126729 * lr + 0.7151522 * lg + 0.0721750 * lb) / D65_YN;
      const z = (0.0193339 * lr + 0.1191920 * lg + 0.9503041 * lb) / D65_ZN;

      const fx = x > LAB_EPS ? Math.cbrt(x) : (LAB_KAPPA * x + 16.0 / 116.0);
      const fy = y > LAB_EPS ? Math.cbrt(y) : (LAB_KAPPA * y + 16.0 / 116.0);
      const fz = z > LAB_EPS ? Math.cbrt(z) : (LAB_KAPPA * z + 16.0 / 116.0);

      return [116.0 * fy - 16.0, 500.0 * (fx - fy), 200.0 * (fy - fz)];
    }

    function writeLabToSRGB(L, a, bVal, out, offset) {
      const fy = (L + 16.0) / 116.0;
      const fx = fy + (a / 500.0);
      const fz = fy - (bVal / 200.0);

      const x = D65_XN * (fx > LAB_DELTA ? (fx * fx * fx) : ((fx - 16.0 / 116.0) / LAB_KAPPA));
      const y = D65_YN * (fy > LAB_DELTA ? (fy * fy * fy) : ((fy - 16.0 / 116.0) / LAB_KAPPA));
      const z = D65_ZN * (fz > LAB_DELTA ? (fz * fz * fz) : ((fz - 16.0 / 116.0) / LAB_KAPPA));

      let rLin =  3.2404542 * x - 1.5371385 * y - 0.4985314 * z;
      let gLin = -0.9692660 * x + 1.8760108 * y + 0.0415560 * z;
      let bLin =  0.0556434 * x - 0.2040259 * y + 1.0572252 * z;

      out[offset]     = fastLinToSRGB(rLin);
      out[offset + 1] = fastLinToSRGB(gLin);
      out[offset + 2] = fastLinToSRGB(bLin);
    }

    function labToRgbHex(L, a, bVal) {
      const temp = new Uint8Array(3);
      writeLabToSRGB(L, a, bVal, temp, 0);
      return `rgb(${temp[0]}, ${temp[1]}, ${temp[2]})`;
    }

    // --- 2. POPULAR SHADE SWATCHES ---
    const SWATCHES = [
      { name: "Original",    L: 0,  a: 0,    b: 0,    isOriginal: true },
      { name: "Espresso",    L: 25, a: 5.5,  b: 10.5 },
      { name: "Chocolate",   L: 36, a: 10.5, b: 19.0 },
      { name: "Caramel",     L: 54, a: 11.5, b: 27.5 },
      { name: "Honey Blond", L: 65, a: 6.5,  b: 26.5 },
      { name: "Platinum",    L: 76, a: 1.0,  b: 5.5 },
      { name: "Copper",      L: 51, a: 22.0, b: 32.0 },
      { name: "Ruby Red",    L: 37, a: 38.0, b: 15.5 },
      { name: "Burgundy",    L: 28, a: 27.0, b: 4.5 },
      { name: "Rose Pink",   L: 58, a: 28.0, b: 2.5 },
      { name: "Violet",      L: 39, a: 26.0, b: -26.0 },
      { name: "Denim Blue",  L: 39, a: -3.5, b: -24.0 }
    ];

    // --- 3. APPLICATION STATE ---
    let canvas = document.getElementById('mainCanvas');
    let ctx = canvas.getContext('2d', { willReadFrequently: true });
    let origImageData = null;
    let workingImageData = null;
    let hairMask = null;
    let activeIndices = null;
    let precompL = null, precompA = null, precompB = null;

    let targetL = 36, targetA = 10.5, targetB = 19;
    let liftDelta = 0;
    let isColorApplied = false;
    let selectedSwatchIndex = 0;
    let hairStats = { meanL: 32, meanA: 6, meanB: 12 };

    // --- 4. RENDER SWATCH BUTTONS ---
    const swatchList = document.getElementById('swatchList');
    SWATCHES.forEach((s, idx) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = `swatch-btn ${idx === 0 ? 'active' : ''}`;
      
      const circleBg = s.isOriginal 
        ? 'repeating-conic-gradient(#555 0% 25%, #333 0% 50%) 50% / 10px 10px'
        : labToRgbHex(s.L, s.a, s.b);

      btn.innerHTML = `
        <div class="swatch-circle" style="background: ${circleBg};"></div>
        <div class="swatch-label">${s.name}</div>
      `;

      btn.addEventListener('click', () => {
        document.querySelectorAll('.swatch-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedSwatchIndex = idx;

        if (s.isOriginal) {
          isColorApplied = false;
          if (origImageData) ctx.putImageData(origImageData, 0, 0);
          return;
        }

        isColorApplied = true;
        targetL = s.L;
        targetA = s.a;
        targetB = s.b;
        
        const chroma = Math.round(Math.hypot(targetA, targetB));
        document.getElementById('chromaSlider').value = chroma;
        document.getElementById('chromaDisplay').textContent = chroma;

        applyHairColor();
      });

      swatchList.appendChild(btn);
    });

    // --- 5. IMAGE UPLOADING & FAST MASK GENERATION ---
    const fileInput = document.getElementById('fileInput');
    document.getElementById('uploadBtn').onclick = () => fileInput.click();
    document.getElementById('emptyBox').onclick = () => fileInput.click();

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files?.[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => loadStudioImage(img);
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    });

    function loadStudioImage(img) {
      // Scale down image to max 720px for high mobile performance
      const maxDim = 720;
      let w = img.naturalWidth || img.width;
      let h = img.naturalHeight || img.height;
      if (w > maxDim || h > maxDim) {
        if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
        else { w = Math.round((w * maxDim) / h); h = maxDim; }
      }

      canvas.width = w;
      canvas.height = h;
      ctx.drawImage(img, 0, 0, w, h);

      origImageData = ctx.getImageData(0, 0, w, h);
      workingImageData = ctx.createImageData(w, h);
      workingImageData.data.set(origImageData.data);

      document.getElementById('emptyBox').classList.add('hidden');
      document.getElementById('canvasWrap').classList.remove('hidden');

      // Create instant fast hair-region mask immediately (ensures instant mobile feedback)
      createFastMask(w, h);

      // Select first non-original swatch
      if (selectedSwatchIndex === 0) {
        swatchList.children[1].click();
      } else {
        applyHairColor();
      }

      // Try running MediaPipe hair segmenter in the background if network supports it
      tryInitMediaPipe(canvas);
    }

    function createFastMask(w, h) {
      const totalPixels = w * h;
      hairMask = new Float32Array(totalPixels);
      precompL = new Float32Array(totalPixels);
      precompA = new Float32Array(totalPixels);
      precompB = new Float32Array(totalPixels);

      const src = origImageData.data;
      const active = [];

      for (let i = 0; i < totalPixels; i++) {
        const idx = i * 4;
        const [L, a, b] = sRGBToLab(src[idx], src[idx + 1], src[idx + 2]);
        precompL[i] = L;
        precompA[i] = a;
        precompB[i] = b;
      }

      // Top 50% head region check
      const topHalf = Math.floor(h * 0.52);
      let sumL = 0, count = 0;

      for (let y = 0; y < h; y++) {
        const isTop = y < topHalf;
        for (let x = 0; x < w; x++) {
          const i = y * w + x;
          const L = precompL[i];
          const a = precompA[i];
          const b = precompB[i];

          // Hair heuristic: top half, darker tones or brownish/black tones
          if (isTop && L < 75 && Math.abs(a) < 32 && Math.abs(b) < 38) {
            hairMask[i] = 0.85;
            active.push(i);
            sumL += L;
            count++;
          } else {
            hairMask[i] = 0.0;
          }
        }
      }

      if (active.length > 0) {
        hairStats.meanL = sumL / count;
      }
      activeIndices = new Uint32Array(active);
    }

    // Optional background AI enhancement (MediaPipe)
    async function tryInitMediaPipe(canvasEl) {
      try {
        const { ImageSegmenter, FilesetResolver } = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs");
        const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
        const segmenter = await ImageSegmenter.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/image_segmenter/hair_segmenter/float32/latest/hair_segmenter.tflite",
            delegate: "CPU" // Use CPU for safety on mobile
          },
          runningMode: "IMAGE",
          outputConfidenceMasks: true
        });

        const res = segmenter.segment(canvasEl);
        if (res?.confidenceMasks?.length > 1) {
          const raw = res.confidenceMasks[1].getAsFloat32Array();
          const total = canvas.width * canvas.height;
          const active = [];
          for (let i = 0; i < total; i++) {
            const conf = raw[i];
            hairMask[i] = conf;
            if (conf > 0.1) active.push(i);
          }
          activeIndices = new Uint32Array(active);
          if (isColorApplied) applyHairColor();
        }
      } catch (err) {
        // Fallback mask is already active, so nothing breaks
        console.log("MediaPipe notice (using robust built-in mask):", err.message);
      }
    }

    // --- 6. COLOR APPLICATION ---
    function applyHairColor() {
      if (!isColorApplied || !origImageData || !activeIndices) return;

      const src = origImageData.data;
      const dst = workingImageData.data;
      dst.set(src);

      const goalL = Math.max(12, Math.min(88, targetL + liftDelta));
      const baseL = hairStats.meanL;
      const deltaL = goalL - baseL;
      const count = activeIndices.length;

      for (let k = 0; k < count; k++) {
        const i = activeIndices[k];
        const conf = hairMask[i];
        const idx = i * 4;

        const origL = precompL[i];
        const origA = precompA[i];
        const origB = precompB[i];

        // Natural luminosity blending
        let outL = deltaL >= 0 
          ? origL + deltaL * (1.0 - Math.exp(-origL / 16.0)) * 0.9
          : origL * Math.max(0.3, goalL / Math.max(15, baseL));

        outL = Math.max(4, Math.min(96, outL));

        const alpha = conf * 0.88;
        const invAlpha = 1.0 - alpha;

        const finalL = origL * invAlpha + outL * alpha;
        const finalA = origA * invAlpha + targetA * alpha;
        const finalB = origB * invAlpha + targetB * alpha;

        writeLabToSRGB(finalL, finalA, finalB, dst, idx);
      }

      ctx.putImageData(workingImageData, 0, 0);
    }

    // --- 7. SLIDER CONTROLS ---
    document.getElementById('chromaSlider').addEventListener('input', (e) => {
      const c = parseFloat(e.target.value);
      document.getElementById('chromaDisplay').textContent = c;
      const angle = Math.atan2(targetB, targetA);
      targetA = c * Math.cos(angle);
      targetB = c * Math.sin(angle);
      if (isColorApplied) applyHairColor();
    });

    document.getElementById('liftSlider').addEventListener('input', (e) => {
      liftDelta = parseFloat(e.target.value);
      document.getElementById('liftDisplay').textContent = liftDelta > 0 ? `+${liftDelta}` : `${liftDelta}`;
      if (isColorApplied) applyHairColor();
    });

    // --- 8. HOLD ORIGINAL BUTTON ---
    const holdBtn = document.getElementById('holdOriginalBtn');
    const showOrig = (e) => {
      e.preventDefault();
      if (origImageData) ctx.putImageData(origImageData, 0, 0);
    };
    const showColor = (e) => {
      e.preventDefault();
      if (isColorApplied) applyHairColor();
    };

    holdBtn.addEventListener('pointerdown', showOrig);
    holdBtn.addEventListener('pointerup', showColor);
    holdBtn.addEventListener('pointerleave', showColor);
  </script>
</body>
</html>
